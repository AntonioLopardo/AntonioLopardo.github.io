<style>
:root{--paper:#faf5ec;--ink:#181410;--faint:#6f6353;--rule:#d8cdbb;--accent:#bc3417;--accent-2:#274690;--hl:#f3e8cf;--tiles:light}
@media(prefers-color-scheme:dark){:root{--paper:#161310;--ink:#ece4d4;--faint:#9c8f7a;--rule:#3a332a;--accent:#e8603f;--accent-2:#7d9be0;--hl:#2a241b;--tiles:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono",monospace}
#map{position:absolute;inset:0;background:var(--paper)}
.leaflet-container{background:var(--paper);font-family:inherit}
/* floating title/legend panel */
.panel{position:absolute;z-index:1000;top:18px;left:18px;max-width:min(340px,calc(100vw - 36px));
  background:var(--paper);border:1px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.16);padding:15px 17px}
.panel .over{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.panel h1{font-family:"Fraunces",serif;font-weight:850;font-size:30px;line-height:1;letter-spacing:-.02em;margin:.25em 0 .15em}
.panel .sub{font-size:11.5px;color:var(--faint);line-height:1.5;margin-bottom:11px}
.filters{display:flex;gap:0;border:1px solid var(--rule);width:fit-content}
.filters button{font:inherit;font-size:11px;letter-spacing:.04em;cursor:pointer;background:none;border:0;border-right:1px solid var(--rule);color:var(--faint);padding:6px 11px}
.filters button:last-child{border-right:0}
.filters button.on{background:var(--ink);color:var(--paper)}
.legend{display:flex;gap:15px;margin-top:11px;font-size:11px;color:var(--faint);align-items:center}
.legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid}
.legend .met{border-color:var(--accent);background:var(--hl)}
.legend .fol{border-color:var(--accent-2);background:transparent}
/* photo pins */
.pin{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2.5px solid var(--accent-2);
  background:var(--paper);box-shadow:0 1px 6px rgba(0,0,0,.35)}
.pin.rel-met{border-color:var(--accent)}
.pin:hover{z-index:10000 !important}
.pin img{width:100%;height:100%;object-fit:cover;display:block}
.pin .mono{width:100%;height:100%;display:grid;place-items:center;font-size:13px;color:var(--paper)}
.leaflet-marker-icon:hover{z-index:10000 !important}
/* popup */
.leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:0;box-shadow:5px 5px 0 rgba(0,0,0,.16)}
.leaflet-popup-tip{background:var(--paper);border:1px solid var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-family:inherit}
.pop{display:flex;gap:11px;align-items:flex-start;min-width:210px}
.pop .ph{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--rule)}
.pop .mono{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--paper);flex:none}
.pop .nm{font-family:"Fraunces",serif;font-weight:640;font-size:16px;line-height:1.15}
.pop .tag{font-size:9px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);padding:1px 5px;color:var(--faint);margin-left:.4em;vertical-align:.14em}
.pop .tag.met{color:var(--accent);border-color:var(--accent)}
.pop .af{font-size:11.5px;color:var(--faint);line-height:1.4;margin-top:3px}
.pop .ci{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);margin-top:4px}
.attriblink{position:absolute;z-index:1000;bottom:2px;right:4px;font-size:9px;color:var(--faint)}
</style></head><body>

const P=DATA.photos, people=DATA.people;
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function initials(n){return n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function monoHTML(n,cls){return `<div class="mono ${cls||''}" style="background:hsl(${hue(n)} 42% 42%)">${initials(n)}</div>`}
function photoImg(p,cls){
  return `<img class="${cls||''}" src="${P}/${esc(p.photo)}" alt="${esc(p.name)}" `
    +`onerror="this.outerHTML=this.getAttribute('data-fb')" data-fb='${monoHTML(p.name,cls).replace(/'/g,"&#39;")}'>`;
}
const map=L.map('map',{worldCopyJump:true,zoomControl:true}).setView([40,0],2);
L.control.attribution({prefix:false}).addTo(map);
const tiles=dark
  ? 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png'
  : 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png';
L.tileLayer(tiles,{maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);

function pinIcon(p){
  return L.divIcon({className:'',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-18],
    html:`<div class="pin rel-${p.rel}">${photoImg(p,'')}</div>`});
}
function popupHTML(p){
  const metTag=p.rel==='met'?'<span class="tag met">interacted</span>':'<span class="tag">following</span>';
  return `<div class="pop">${photoImg(p,'ph')}<div>`
    +`<div class="nm">${esc(p.name)}${metTag}</div>`
    +`<div class="af">${esc(p.aff)}</div>`
    +`<div class="ci">${esc(p.city)}${p.approx?' · approx':''}${p.met_at?' · '+esc(p.met_at):''}</div>`
    +`</div></div>`;
}
const layer=L.layerGroup().addTo(map);
let markers=[];
function build(filter){
  layer.clearLayers(); markers=[];
  const shown=people.filter(p=>filter==='all'||p.rel===filter);
  // draw 'following' first so 'interacted' faces sit on top where they overlap
  shown.sort((a,b)=>(a.rel==='met')-(b.rel==='met'));
  shown.forEach(p=>{
    const m=L.marker([p.dlat,p.dlon],{icon:pinIcon(p),title:p.name,riseOnHover:true});
    m.bindPopup(popupHTML(p),{closeButton:true});
    layer.addLayer(m); markers.push(m);
  });
  document.getElementById('sub').innerHTML=
    `<b>${shown.length}</b> researchers · <b>${new Set(shown.map(p=>p.city)).size}</b> cities`
    +`<br>every face always shown — zoom into a city to separate them`;
}
build('all');
try{map.fitBounds(L.latLngBounds(people.map(p=>[p.dlat,p.dlon])).pad(0.12),{maxZoom:6});}catch(e){}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); build(b.dataset.f);
}));

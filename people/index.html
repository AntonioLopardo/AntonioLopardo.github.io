<style>
:root{--paper:#faf5ec;--ink:#181410;--faint:#6f6353;--rule:#d8cdbb;--accent:#bc3417;--accent-2:#274690;--hl:#f3e8cf}
@media(prefers-color-scheme:dark){:root{--paper:#161310;--ink:#ece4d4;--faint:#9c8f7a;--rule:#3a332a;--accent:#e8603f;--accent-2:#7d9be0;--hl:#2a241b}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.5}
.wrap{max-width:940px;margin:0 auto;padding:56px 20px 90px}
.overline{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
h1{font-family:"Fraunces",serif;font-weight:850;font-size:clamp(38px,7vw,64px);line-height:.98;letter-spacing:-.02em;margin:.2em 0 .12em}
.standfirst{font-style:italic;color:var(--faint);margin:0 0 22px;font-size:18px}
hr.a{border:0;border-top:3px solid var(--ink);margin:0 0 2px}hr.b{border:0;border-top:1px solid var(--ink);margin:0 0 22px}
.views{display:flex;gap:10px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12.5px;margin-bottom:8px}
.views a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);border:1px solid var(--ink);padding:8px 14px}
.views a:hover{background:var(--hl)}
.controls{display:flex;align-items:center;gap:12px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;margin:14px 0 4px}
.controls input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--rule);padding:7px 10px;min-width:200px}
.controls .count{color:var(--faint)}
.grouphead{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:30px 0 12px;display:flex;align-items:center;gap:14px}
.grouphead::after{content:"";flex:1;border-top:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:20px 12px}
a.person{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:inherit;gap:7px}
.ph,.mono{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2.5px solid var(--accent-2)}
a.person.met .ph,a.person.met .mono{border-color:var(--accent)}
.mono{display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--paper)}
a.person .nm{font-size:13.5px;line-height:1.2}
a.person:hover .nm{color:var(--accent)}
a.person:hover .ph,a.person:hover .mono{filter:brightness(1.06);transform:translateY(-2px)}
a.person .ph,a.person .mono{transition:transform .12s,filter .12s}
.empty{font-family:"IBM Plex Mono",monospace;color:var(--faint);padding:40px 0}
footer{margin-top:50px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
footer a{color:var(--accent-2);text-decoration:none}
</style></head><body><div class="wrap">

const q=document.getElementById('q'), list=document.getElementById('list'), count=document.getElementById('count');
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function initials(n){return n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function face(p){
  const cls=p.rel==='met'?'met':'';
  const img=`<img class="ph" src="${P}/${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy" `
    +`onerror="this.outerHTML=this.getAttribute('data-fb')" `
    +`data-fb='<span class=&quot;mono&quot; style=&quot;background:hsl(${hue(p.name)} 42% 42%)&quot;>${initials(p.name)}</span>'>`;
  return `<a class="person ${cls}" href="/papers.html?p=${encodeURIComponent(p.name)}" title="${esc(p.aff)}">`
    +`${img}<span class="nm">${esc(p.name)}</span></a>`;
}
function group(label, arr){
  if(!arr.length) return '';
  return `<div class="grouphead">${label} · ${arr.length}</div><div class="grid">${arr.map(face).join('')}</div>`;
}
function render(){
  const t=q.value.trim().toLowerCase();
  const shown=people.filter(p=>!t||(p.name+' '+p.aff).toLowerCase().includes(t));
  const met=shown.filter(p=>p.rel==='met').sort((a,b)=>a.name.localeCompare(b.name));
  const fol=shown.filter(p=>p.rel!=='met').sort((a,b)=>a.name.localeCompare(b.name));
  count.textContent=shown.length+' / '+people.length;
  list.innerHTML=(group('Interacted with',met)+group('Following',fol))||'<div class="empty">NOBODY MATCHES.</div>';
}
q.addEventListener('input',render); render();

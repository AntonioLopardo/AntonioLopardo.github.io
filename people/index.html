<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Newsreader:opsz,wght@6..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf5ec;--ink:#181410;--faint:#6f6353;--rule:#d8cdbb;--accent:#bc3417;--accent-2:#274690;--hl:#f3e8cf}
@media(prefers-color-scheme:dark){:root{--paper:#161310;--ink:#ece4d4;--faint:#9c8f7a;--rule:#3a332a;--accent:#e8603f;--accent-2:#7d9be0;--hl:#2a241b}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:64px 20px 90px}
.overline{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
h1{font-family:"Fraunces",serif;font-weight:850;font-size:clamp(38px,7vw,64px);line-height:.98;letter-spacing:-.02em;margin:.2em 0 .12em}
.standfirst{font-style:italic;color:var(--faint);margin:0 0 30px;font-size:18px}
hr.a{border:0;border-top:3px solid var(--ink);margin:0 0 2px}hr.b{border:0;border-top:1px solid var(--ink);margin:0 0 30px}
.cards{display:grid;gap:16px}
a.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;text-decoration:none;color:inherit;
  border:1px solid var(--ink);padding:22px 24px;background:var(--paper);transition:background .12s,transform .12s}
a.card:hover{background:var(--hl);transform:translateY(-2px)}
.card .ic{font-size:34px;line-height:1}
.card h2{font-family:"Fraunces",serif;font-weight:640;font-size:22px;margin:0 0 3px}
.card p{margin:0;font-size:14.5px;color:var(--faint)}
.card .go{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--accent)}
footer{margin-top:44px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
footer a{color:var(--accent-2);text-decoration:none}
</style></head><body><div class="wrap">
<div class="overline">Antonio Lopardo</div>
<h1>People</h1>
<p class="standfirst">Researchers I have interacted with at conferences, and a few I just follow. Two ways to look at them.</p>
<hr class="a"><hr class="b">
<div class="cards">
  <a class="card" href="/people-map.html">
    <span class="ic">🗺️</span>
    <span><h2>Map</h2><p>Where they are based, around the world.</p></span>
    <span class="go">→</span>
  </a>
  <a class="card" href="/papers.html">
    <span class="ic">📄</span>
    <span><h2>Papers feed</h2><p>Recent papers from all of them, filterable by person.</p></span>
    <span class="go">→</span>
  </a>
</div>
<footer><a href="/">← back to site</a></footer>
</div></body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Newsreader:opsz,wght@6..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #faf5ec;
        --ink: #181410;
        --faint: #6f6353;
        --rule: #d8cdbb;
        --accent: #bc3417;
        --accent-2: #274690;
        --hl: #f3e8cf;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #161310;
          --ink: #ece4d4;
          --faint: #9c8f7a;
          --rule: #3a332a;
          --accent: #e8603f;
          --accent-2: #7d9be0;
          --hl: #2a241b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Newsreader", Georgia, serif;
        font-size: 17px;
        line-height: 1.5;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 52px 20px 90px;
      }
      .overline {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .overline a {
        color: inherit;
        text-decoration: none;
      }
      .overline a:hover {
        color: var(--accent);
      }
      h1 {
        font-family: "Fraunces", serif;
        font-weight: 850;
        letter-spacing: -0.02em;
        margin: 0.15em 0 0.1em;
      }
      a {
        color: var(--accent-2);
      }
      .mono {
        display: grid;
        place-items: center;
        font-family: "IBM Plex Mono", monospace;
        color: var(--paper);
      }
    </style>
    <title>Junyi Jessy Li</title>
    <style>
      .overline {
        margin-bottom: 26px;
      }
      .hd {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      .ph,
      .hd .mono {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        font-size: 30px;
      }
      h1 {
        font-size: clamp(30px, 5vw, 44px);
        line-height: 1;
      }
      .aff {
        color: var(--faint);
        font-size: 16.5px;
        margin-top: 4px;
      }
      .tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 1px solid var(--rule);
        padding: 2px 7px;
        color: var(--faint);
        vertical-align: 0.2em;
        margin-left: 0.5em;
      }
      .tag.met {
        color: var(--accent);
        border-color: var(--accent);
      }
      .metat {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--faint);
        margin-top: 8px;
      }
      .contacts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 6px;
      }
      .contacts a {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        text-decoration: none;
        color: var(--ink);
        border: 1px solid var(--rule);
        padding: 6px 11px;
      }
      .contacts a:hover {
        border-color: var(--accent);
        background: var(--hl);
      }
      hr.b {
        border: 0;
        border-top: 1px solid var(--ink);
        margin: 26px 0 6px;
      }
      .sec {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 22px 0 10px;
      }
      ol.papers {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ol.papers li {
        padding: 13px 2px;
        border-bottom: 1px solid var(--rule);
      }
      ol.papers .t {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 18px;
        color: var(--ink);
        text-decoration: none;
        line-height: 1.25;
      }
      ol.papers .t:hover {
        color: var(--accent);
      }
      ol.papers .m {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11.5px;
        color: var(--faint);
        display: flex;
        gap: 1.3em;
        flex-wrap: wrap;
        margin-top: 5px;
      }
      ol.papers .m .v {
        text-transform: uppercase;
        letter-spacing: 0.13em;
      }
      ol.papers .m a {
        color: var(--accent-2);
        text-decoration: none;
      }
      ol.papers .m a.alpha {
        color: var(--accent);
        font-weight: 500;
      }
      .none {
        color: var(--faint);
        font-style: italic;
      }
      footer {
        margin-top: 44px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
      }
      footer a {
        color: var(--accent-2);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="overline"><a href="/people/">← People</a></div>
      <div class="hd">
        <img
          class="ph"
          src="/assets/img/people/junyi-jessy-li.jpg"
          alt="Junyi Jessy Li"
          loading="lazy"
          onerror="this.outerHTML=this.getAttribute('data-fb')"
          data-fb='<span class="ph" style="background:hsl(308 42% 42%)">JJ</span>'
        />
        <div>
          <h1>Junyi Jessy Li <span class="tag">following</span></h1>
          <div class="aff">UT Austin</div>
        </div>
      </div>
      <div class="contacts">
        <a href="https://x.com/jessyjli" target="_blank" rel="noopener">@jessyjli</a
        ><a href="/papers.html?p=Junyi%20Jessy%20Li">Papers in the feed →</a>
      </div>
      <hr class="b" />
      <div class="sec">Papers · 0</div>
      <p class="none">No papers in the feed yet.</p>
      <footer><a href="/people/">← all people</a> · <a href="/people-map.html">map</a></footer>
    </div>
  </body>
</html>

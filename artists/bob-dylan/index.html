const IMG = k => A.images[k] || null;
const ink = hex => { const n = parseInt(hex.slice(1),16), r=n>>16, g=n>>8&255, b=n&255; return (0.299*r+0.587*g+0.114*b) > 150 ? "#141414" : "#f7f7f7"; };

const LANE = {album:"music",single:"music",lineup:"stage",live:"stage",life:"life",award:"life",screen:"life",world:"world"};
const KIND = {life:["Life","--life"],lineup:["Line-up","--stage"],live:["Stage","--stage"],world:["World","--world"],screen:["Screen","--screen"],award:["Honour","--award"]};
const TIER = {e:"Essential",g:"Worth it",d:"Completists"};

const events = A.events.map((e,i)=>({...e,_i:i})).sort((a,b)=> a.d.localeCompare(b.d) || a._i-b._i);
let studioN = 0;
events.forEach((e,i) => { e.id = "e" + i; e.lane = LANE[e.k]; if (e.k==="album" && e.kind==="Studio") e.no = ++studioN; e.short = e.short || e.title || e.t; e.img = IMG(e.title || e.short) || IMG(e.short); });
const eraOf = y => A.eras.find(e => y >= e.from && y <= e.to) || A.eras[A.eras.length-1];
const byYear = {}; events.forEach(e => (byYear[yearOf(e.d)] = byYear[yearOf(e.d)] || []).push(e));

/* ---------- head ---------- */
$("#head").innerHTML = `<div class="title"><div class="eyebrow">Artist study</div><h1>${esc(A.name)}</h1><div class="facts">${A.facts.map(f=>`<span>${f}</span>`).join("")}</div></div>
  <div class="faces">${(A.faces||[]).filter(y=>IMG("face:"+y)).map(y=>`<figure><img src="${IMG("face:"+y)}" alt="${esc(A.name)} in ${y}"><figcaption>${y}</figcaption></figure>`).join("")}</div>`;

/* ---------- wall ---------- */
const lastYear = Math.max(...events.map(e=>yearOf(e.d)));
const cols = []; let gapStart = null;
const wallPics = y => (byYear[y]||[]).filter(e => (e.lane==="life"||e.lane==="stage") && e.img && e.imp!==2).slice(0,2);
const wallMusic = y => (byYear[y]||[]).filter(e => e.lane==="music");
for (let y = A.wallFrom; y <= lastYear; y++){
  const m = wallMusic(y), p = wallPics(y);
  if (!m.length && !p.length){ if (gapStart===null) gapStart = y; continue; }
  if (gapStart!==null){ cols.push({gap:[gapStart, y-1]}); gapStart = null; }
  cols.push({y, m, p});
}
let lastEra = null;
$("#wall").innerHTML = cols.map(c => {
  const yr = c.gap ? c.gap[0] : c.y, er = eraOf(yr);
  const label = er !== lastEra ? `<span>${esc(er.name)}</span>` : ""; lastEra = er;
  const st = `--era:${er.color};--t:${ink(er.color)}`;
  if (c.gap) return `<div class="wcol gap" style="${st}" data-era="${er.id}"><span class="wy">${c.gap[0]}${c.gap[1]>c.gap[0]?"–"+String(c.gap[1]).slice(2):""}</span><div></div><div class="wband">${label}</div></div>`;
  const music = c.m.map(e => {
    const cls = e.k==="single" ? "s" : e.tier;
    const src = e.img;
    return `<a class="${cls}" href="#${e.id}" title="${esc(e.title)}, ${fmt(e.d)} ${yearOf(e.d)}">${src?`<img src="${src}" alt="${esc(e.title)}" loading="lazy">`:coverDiv(e, cls==="e"?116:cls==="g"?88:58)}</a>`;
  }).join("");
  const pics = c.p.map(e => `<a class="wcard" href="#${e.id}"><img src="${e.img}" alt="" loading="lazy"><span><i style="background:var(${KIND[e.k][1]})"></i>${esc(e.short)}</span></a>`).join("");
  return `<div class="wcol" style="${st}" data-era="${er.id}" id="w${c.y}"><button class="wy" data-y="${c.y}">${c.y}</button><div class="wmusic">${music}</div><div class="wlife">${pics}</div><div class="wband">${label}</div></div>`;
}).join("") + `<div style="flex:none;width:24px"></div>`;
const wall = $("#wall");
/* keep each era label inside its own stretch of band */
function fitEraLabels(){
  wall.querySelectorAll(".wband span").forEach(sp => {
    const col = sp.closest(".wcol"), id = col.dataset.era; let w = 0, c = col;
    while (c && c.dataset && c.dataset.era === id){ w += c.offsetWidth; c = c.nextElementSibling; }
    Object.assign(sp.style, {maxWidth: Math.max(20, w - 16) + "px", overflow: "hidden", textOverflow: "ellipsis"});
  });
}
fitEraLabels();
wall.addEventListener("click", ev => { const b = ev.target.closest(".wy[data-y]"); if (b) jumpYear(+b.dataset.y); });
$("#prev").onclick = () => wall.scrollBy({left: -wall.clientWidth*.8, behavior:"smooth"});
$("#next").onclick = () => wall.scrollBy({left: wall.clientWidth*.8, behavior:"smooth"});
$("#erachips").innerHTML = A.eras.filter(er => wall.querySelector(`[data-era="${er.id}"]`)).map(er => `<button class="era-chip" data-era="${er.id}" style="--c:${er.color};--t:${ink(er.color)}">${esc(er.name)}</button>`).join("");
$("#erachips").addEventListener("click", ev => { const b = ev.target.closest(".era-chip"); if (!b) return; const col = wall.querySelector(`.wcol[data-era="${b.dataset.era}"]`); if (col) wall.scrollTo({left: col.offsetLeft - wall.offsetLeft - 14, behavior:"smooth"}); });
function jumpYear(yr){ const el = document.getElementById("y" + yr); if (!el) return; const sec = el.closest(".era.closed"); if (sec) sec.querySelector(".era-tog").click(); el.scrollIntoView({block:"start"}); }

/* ---------- chronology ---------- */
function coverDiv(e, size){
  const [a,b] = e.c || ["#555","#222"];
  return `<div class="cover" style="width:${size}px;height:${size}px;background:linear-gradient(135deg, ${a}, ${b});color:${ink(a)}"><span class="ct">${esc(e.title)}</span></div>`;
}
const tagHTML = s => s.tag==="k" ? `<span class="tag k">Heard it${s.via?" · "+esc(s.via.replace(/^via /,"")):""}</span>` : s.tag==="m" ? `<span class="tag m">Should know</span>` : "";
const nrm = s => s.toLowerCase().normalize("NFKD").replace(/\(.*?\)/g,"").replace(/[^a-z0-9]/g,"");
const mmss = s => s == null ? "" : Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
/* favourites: every heart has a stable key; TARGET maps it to its place in the timeline */
const HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.4-4.6-9.5-9.1C1 8.2 3.1 4.6 6.7 4.6c2.3 0 4 1.3 5.3 3 1.3-1.7 3-3 5.3-3 3.6 0 5.7 3.6 4.2 6.8-2.1 4.5-9.5 9.1-9.5 9.1z"/></svg>`;
const TARGET = {}, META = {};
const ctxOf = e => e.title || e.short;
const songKey = (t, e) => "s:" + nrm(t) + "|" + nrm(ctxOf(e));
const albumKey = e => "a:" + nrm(e.title);
function fav(key, meta, id, open, label){
  if (!TARGET[key] && id) TARGET[key] = {id, open};
  if (!META[key]) META[key] = meta;
  return `<button class="fav${label?" lab":""}" data-key="${esc(key)}" aria-pressed="false" aria-label="Favourite: ${esc(meta.title)}" title="Add to my favourites">${HEART}${label?`<span>${label}</span>`:""}</button>`;
}
const songFav = (t, e, open) => fav(songKey(t, e), {kind:"song", title:t, ctx:ctxOf(e), year:yearOf(e.d), img:e.img||""}, e.id, open);
function fullList(e){
  const tl = (A.tracklists||{})[e.title]; if (!tl) return "";
  const keyed = {}; (e.songs||[]).forEach(s => keyed[nrm(s.s)] = s);
  const all = tl.flatMap(m => m[1]); const total = all.reduce((a,t)=>a+(t[1]||0),0);
  const multi = tl.length > 1; let n = 0;
  const body = tl.map(([lbl, ts]) => `${multi?`<li class="med">${esc(lbl)}</li>`:""}${ts.map(([t,sec]) => { n++; const k = keyed[nrm(t)];
    return `<li class="${k&&k.tag?"key":""}"><span class="no">${multi?ts.indexOf(ts.find(x=>x[0]===t))+1:n}</span>${songFav(t, e, true)}<a href="${spot(t)}" target="_blank" rel="noopener">${esc(t)}</a>${k&&k.tag?`<span class="tag ${k.tag}">${k.tag==="k"?"Heard it":"Should know"}</span>`:"<span></span>"}<span class="dur">${mmss(sec)}</span></li>`; }).join("")}`).join("");
  return `<details class="full"><summary>Full tracklist<span>${all.length} songs${total?" · "+Math.round(total/60)+" min":""}</span></summary><ol>${body}</ol></details>`;
}
const tracks = (songs, e) => songs && songs.length ? `<div class="tracks"><span class="th">Key songs</span>${songs.map(s=>`<div class="tr" data-tag="${s.tag||""}">${songFav(s.s, e, false)}<a href="${spot(s.s)}" target="_blank" rel="noopener">${esc(s.s)}</a>${tagHTML(s)}${s.n?`<span class="note">${esc(s.n)}</span>`:""}</div>`).join("")}</div>` : "";

function musicItem(e){
  if (e.k==="single") return `<article class="single" id="${e.id}" data-lane="music">${e.img?`<img src="${e.img}" alt="${esc(e.title)} single" loading="lazy">`:""}<span class="type">Single · ${fmt(e.d)} ${yearOf(e.d)}</span><h3>${esc(e.title)}</h3><p>${esc(e.t)}</p>${tracks(e.songs, e)}</article>`;
  const label = e.kind==="Studio" ? `Studio album ${e.no} of ${studioN}` : e.kind==="Supergroup" ? "Supergroup album" : e.kind==="Live" ? "Live album" : "Archival release";
  const art = e.img ? `<img src="${e.img}" alt="Cover of ${esc(e.title)}" loading="lazy">` : coverDiv(e, e.tier==="d"?64:132);
  return `<article class="album ${e.tier}" id="${e.id}" data-lane="music" data-tier="${e.tier}"><div class="art">${art}</div>
    <div class="meta"><span class="type">${label} · ${fmt(e.d)} ${yearOf(e.d)}</span><h3>${esc(e.title)}</h3><span class="tierrow"><span class="tier ${e.tier}">${TIER[e.tier]}</span>${fav(albumKey(e), {kind:"album", title:e.title, year:yearOf(e.d), img:e.img||""}, e.id, false, "Favourite")}</span>${e.tier!=="d"?`<p>${esc(e.sound)}</p>`:""}</div>
    ${e.tier==="d"?`<p style="grid-column:1/-1;margin:0">${esc(e.sound)}</p>`:""}${tracks(e.songs, e)}${fullList(e)}</article>`;
}
function sideItem(e){
  const [lbl,col] = KIND[e.k];
  return `<div class="ev ${e.k}${e.img?" pic":""}" id="${e.id}" data-lane="${e.lane}" data-imp="${e.imp||1}" style="--c:var(${col})">${e.img?`<img src="${e.img}" alt="" loading="lazy">`:""}<span class="kind">${lbl}<span class="when">${fmt(e.d)}</span></span><span class="txt">${esc(e.t)}</span>${tracks(e.songs, e)}</div>`;
}
const person = ([n, r]) => { const src = IMG("p:"+n); return `<figure>${src?`<img src="${src}" alt="" loading="lazy">`:`<span class="ph">${esc(n.split(" ").map(w=>w[0]).slice(0,2).join(""))}</span>`}<figcaption>${esc(n)}<small>${esc(r)}</small></figcaption></figure>`; };
let html = "";
A.eras.forEach(er => {
  const evs = events.filter(e => eraOf(yearOf(e.d)) === er); if (!evs.length) return;
  const nAlb = evs.filter(e => e.k==="album").length, nMom = evs.length - evs.filter(e => e.lane==="music").length;
  const sum = [nAlb ? `${nAlb} album${nAlb>1?"s":""}` : "", nMom ? `${nMom} moment${nMom>1?"s":""}` : ""].filter(Boolean).join(" · ");
  html += `<section class="era" data-era="${er.id}" style="--era:${er.color}"><div class="era-head" id="era-${er.id}"><button class="era-tog" data-era="${er.id}" aria-expanded="true" aria-controls="era-${er.id}"><span class="lbl">Collapse</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 8 4-4 4 4"/></svg></button><span class="yrs">${er.from}–${until(er.to)}<span class="era-sum"> · ${sum}</span></span><h2>${esc(er.name)}</h2><p>${esc(er.sound)}</p>${er.people?`<div class="who">${er.people.map(person).join("")}</div>`:""}</div>`;
  [...new Set(evs.map(e=>yearOf(e.d)))].forEach(y => {
    const ys = evs.filter(e=>yearOf(e.d)===y);
    html += `<div class="yr" id="y${y}"><div class="col music">${ys.filter(e=>e.lane==="music").map(musicItem).join("")}</div><div class="spine"><b>${y}</b></div><div class="col side">${ys.filter(e=>e.lane!=="music").map(sideItem).join("")}</div></div>`;
  });
  html += `</section>`;
});
$("#chrono").innerHTML = html;

/* ---------- controls ---------- */
const show = {music:true, stage:true, life:true, world:true}; let ess = false;
const CH = [["music","Music","--ink"],["stage","Line-ups & stage","--stage"],["life","Life","--life"],["world","World","--world"]];
$("#controls").innerHTML = `<span class="lbl">Show</span>` + CH.map(([k,l,c])=>`<button class="chip" data-l="${k}" aria-pressed="true"><i style="background:var(${c})"></i>${l}</button>`).join("") + `<button class="chip ess" id="ess" aria-pressed="false">Essentials only</button><span class="lbl" style="margin-left:12px">Eras</span><button class="chip ess" id="eraAll" aria-pressed="false">Collapse all</button>`;
$("#legend").innerHTML = `<span><span class="tag k">Heard it</span> you have probably heard it, and where</span><span><span class="tag m">Should know</span> essential, maybe new to you</span><span>Song titles open a Spotify search.</span>`;
function apply(){
  document.querySelectorAll("#chrono [data-lane]").forEach(el => {
    let on = show[el.dataset.lane];
    if (ess && (el.dataset.tier==="d" || el.dataset.imp==="2")) on = false;
    el.hidden = !on;
  });
  document.querySelectorAll("#chrono .tr").forEach(r => r.hidden = ess && !r.dataset.tag);
  document.querySelectorAll("#chrono .yr").forEach(r => r.hidden = !r.querySelector("[data-lane]:not([hidden])"));
}
/* collapsible eras (remembered per browser) */
const EKEY = "artist-study:" + A.slug + ":closed-eras";
let closedEras = new Set(); try { closedEras = new Set(JSON.parse(localStorage.getItem(EKEY) || "[]")); } catch(e) {}
function setEra(id, closed, save = true){
  const sec = document.querySelector(`.era[data-era="${id}"]`); if (!sec) return;
  sec.classList.toggle("closed", closed);
  const b = sec.querySelector(".era-tog"); b.setAttribute("aria-expanded", !closed); b.querySelector(".lbl").textContent = closed ? "Expand" : "Collapse";
  closed ? closedEras.add(id) : closedEras.delete(id);
  if (save){ try { localStorage.setItem(EKEY, JSON.stringify([...closedEras])); } catch(e) {} }
  const all = document.querySelectorAll(".era").length, allClosed = closedEras.size >= all;
  const ab = $("#eraAll"); if (ab){ ab.textContent = allClosed ? "Expand all" : "Collapse all"; ab.setAttribute("aria-pressed", allClosed); }
}
const openFor = el => { const sec = el && el.closest(".era.closed"); if (sec) setEra(sec.dataset.era, false); };
document.querySelectorAll(".era").forEach(s => setEra(s.dataset.era, closedEras.has(s.dataset.era), false));
document.addEventListener("click", ev => {
  const t = ev.target.closest(".era-tog");
  const head = !t && ev.target.closest(".era.closed .era-head");
  if (t || head){ const id = (t || head).closest(".era").dataset.era; setEra(id, !closedEras.has(id)); return; }
  const a = ev.target.closest('a[href^="#"]');
  if (a && a.getAttribute("href").length > 1) openFor(document.getElementById(a.getAttribute("href").slice(1)));
});
$("#controls").addEventListener("click", ev => {
  if (ev.target.closest("#eraAll")){ const close = closedEras.size < document.querySelectorAll(".era").length; document.querySelectorAll(".era").forEach(s => setEra(s.dataset.era, close)); return; }
  const c = ev.target.closest(".chip"); if (!c) return;
  if (c.id==="ess"){ ess = !ess; c.setAttribute("aria-pressed", ess); }
  else { const k = c.dataset.l; show[k] = !show[k]; c.setAttribute("aria-pressed", show[k]); }
  apply();
});
$("#foot").innerHTML = `<p>${esc(A.footer)}</p>` + ((A.credits||[]).length ? `<details class="credits"><summary>Image sources (${A.credits.length})</summary><p>Each image links to its page on Wikipedia or Wikimedia Commons, which gives its author and licence. Album and single covers are the labels' artwork, shown for reference.</p><ul>${A.credits.map(([l,u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a></li>`).join("")}</ul></details>` : "");

/* ---------- favourites: saved per person in the page's db, browser storage as fallback ---------- */
const LKEY = "artist-study:" + A.slug + ":favs";
let favs = new Map();            // key -> {key, kind, title, ctx, year}
let mode = "local", note = "";
let favRef = null, writing = false, dirty = false;
try { (JSON.parse(localStorage.getItem(LKEY) || "[]")).forEach(x => favs.set(x.key, x)); } catch(e) {}
const saveLocal = () => { try { localStorage.setItem(LKEY, JSON.stringify([...favs.values()])); } catch(e) {} };
const favList = () => [...favs.values()];

function renderFavs(){
  document.querySelectorAll(".fav[data-key]").forEach(b => b.setAttribute("aria-pressed", favs.has(b.dataset.key)));
  const items = favList().map(x => ({...x, ...(META[x.key]||{}), key:x.key})).sort((a,b) => (a.year||0)-(b.year||0) || (a.kind==="album"?-1:1));
  const albums = items.filter(x => x.kind==="album"), songs = items.filter(x => x.kind==="song");
  const thumbs = [...new Set(items.map(x => x.img).filter(Boolean))].slice(0, 12);
  $("#favsum").innerHTML = `<span class="h">${HEART}My favourites</span><span class="cnt">${items.length ? [albums.length?`${albums.length} album${albums.length>1?"s":""}`:"", songs.length?`${songs.length} song${songs.length>1?"s":""}`:""].filter(Boolean).join(" · ") : "none yet"}</span><span class="thumbs">${thumbs.map(s=>`<img src="${s}" alt="">`).join("")}</span><span class="chev"><svg viewBox="0 0 12 12"><path d="m2 4 4 4 4-4"/></svg></span>`;
  const go = x => TARGET[x.key] ? `href="#${TARGET[x.key].id}" data-go="${esc(x.key)}"` : "";
  $("#favbody").innerHTML = `<div class="favnote">${esc(note || (mode==="account" ? "Saved to your account. They follow you to any device." : "Saved in this browser only."))}</div>` +
    (!items.length ? `<div class="favempty">Tap the ♡ next to any song, or “Favourite” on an album, to collect it here. Each one links back to its place in the timeline.</div>` : "") +
    (albums.length ? `<div><div class="favh">Albums</div><div class="favgrid">${albums.map(x => `<a class="favalb" ${go(x)}>${x.img?`<img src="${x.img}" alt="">`:`<span class="cover"></span>`}<b>${esc(x.title)}</b><span>${x.year||""}</span></a>`).join("")}</div></div>` : "") +
    (songs.length ? `<div><div class="favh">Songs</div><ul class="favsongs">${songs.map(x => `<li>${fav(x.key, x, TARGET[x.key]?.id, TARGET[x.key]?.open)}${x.img?`<img src="${x.img}" alt="">`:`<span class="noimg"></span>`}<span><a class="go" ${go(x)}>${esc(x.title)}</a><span class="ctx">${esc(x.ctx||"")}${x.year?" · "+x.year:""}</span></span><a class="sp" href="${spot(x.title)}" target="_blank" rel="noopener">Spotify ↗</a></li>`).join("")}</ul></div>` : "");
  document.querySelectorAll("#favbody .fav[data-key]").forEach(b => b.setAttribute("aria-pressed", "true"));
}
async function flush(){
  saveLocal();
  if (mode !== "account" || !favRef) return;
  if (writing){ dirty = true; return; }
  writing = true;
  do {
    dirty = false;
    try { await favRef.set({items: favList()}); }
    catch(err){
      if (err && err.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { await favRef.set({items: favList()}); } catch(e2){ note = "Couldn't save to your account just now. Kept in this browser."; } }
      else { mode = "local"; note = "Saving to your account isn't available here. Kept in this browser."; renderFavs(); }
    }
  } while (dirty && mode === "account");
  writing = false;
}
function toggleFav(key){
  if (favs.has(key)) favs.delete(key);
  else { const m = META[key] || {}; favs.set(key, {key, kind:m.kind, title:m.title, ctx:m.ctx||"", year:m.year||null}); }
  renderFavs(); flush();
}
function reveal(key){
  const t = TARGET[key]; if (!t) return;
  const el = document.getElementById(t.id); if (!el) return;
  if (el.hidden || el.closest("[hidden]")){ Object.keys(show).forEach(k => show[k] = true); ess = false;
    document.querySelectorAll("#controls .chip").forEach(c => c.setAttribute("aria-pressed", c.id==="ess" ? "false" : "true")); apply(); }
  openFor(el);
  if (t.open){ const d = el.querySelector("details.full"); if (d) d.open = true; }
  let row = el;
  if (t.open){ row = [...el.querySelectorAll(".fav[data-key]")].find(b => b.dataset.key === key)?.closest("li") || el; }
  row.scrollIntoView({block: "center"});
  row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
}
document.addEventListener("click", ev => {
  const b = ev.target.closest(".fav[data-key]");
  if (b){ ev.preventDefault(); toggleFav(b.dataset.key); return; }
  const g = ev.target.closest("[data-go]");
  if (g){ ev.preventDefault(); reveal(g.dataset.go); }
});
const favsEl = $("#favs");
try { if (localStorage.getItem(LKEY + ":open") === "1") favsEl.open = true; } catch(e) {}
favsEl.addEventListener("toggle", () => { try { localStorage.setItem(LKEY + ":open", favsEl.open ? "1" : "0"); } catch(e) {} });
renderFavs();

(async () => {
  const use = window.claude && window.claude.use;
  if (!use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) return;
  favRef = db.doc("data/users/" + uid + "/favs");
  mode = "account"; note = "Loading your saved favourites…"; renderFavs();
  let first = true;
  const timer = setTimeout(() => { if (first){ note = "Can't reach your saved favourites yet. Showing the ones kept in this browser."; renderFavs(); } }, 10000);
  favRef.onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); }
    if (writing || dirty) return;
    const wasFirst = first; first = false;
    if (snap.exists){
      const items = (snap.data().items || []).filter(x => x && x.key);
      const local = favList();
      favs = new Map(items.map(x => [x.key, x]));
      // first sync on this device: keep anything hearted here before the account copy loaded
      if (wasFirst && local.some(x => !favs.has(x.key))){ local.forEach(x => favs.set(x.key, x)); note = ""; renderFavs(); flush(); return; }
    } else if (wasFirst && favs.size){ note = ""; renderFavs(); flush(); return; }
    note = ""; saveLocal(); renderFavs();
  }, err => { clearTimeout(timer); mode = "local"; note = "Saving to your account isn't available here. Kept in this browser."; renderFavs(); });
})();
})();
</script>

</body>
</html>

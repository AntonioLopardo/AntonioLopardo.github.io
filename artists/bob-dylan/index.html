<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bob Dylan Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: head with faces across the decades, then the wall (a sideways-scrolling row of year columns:
   covers on top, photos of key moments below, era band along the floor), then the chronology:
   music | year spine | life, line-ups & world, grouped by era with portraits of the people. */
/* Single dark look on purpose: warm record-sleeve black so covers and photos carry the colour. */
:root{
  --bg:#0d0c0b; --panel:#161412; --ink:#f3efe7; --sub:#b3aca1; --dim:#7b746a; --line:#2b2723; --shade:rgba(0,0,0,.6);
  --life:#f08cba; --stage:#86b4ff; --world:#9c968c; --award:#e8c45c; --screen:#bc9ff4; --fav:#ff6b81;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs-xs:11px; --fs-s:13px; --fs-m:15px; --fs-l:19px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-m);line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* head */
header .wrap{padding-block:36px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 32px;align-items:end}
.title{display:grid;gap:8px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,88px);line-height:.92;letter-spacing:-.035em}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--sub);font-size:var(--fs-s)}
.facts b{color:var(--ink);font-weight:600}
.faces{display:flex;gap:8px}
.faces figure{margin:0;display:grid;gap:4px}
.faces img{width:112px;height:140px;object-fit:cover;object-position:50% 25%;border-radius:4px;filter:grayscale(.35);box-shadow:0 4px 14px var(--shade)}
.faces figcaption{font-family:var(--mono);font-size:10.5px;color:var(--sub);text-align:center}

/* wall */
.wall-frame{background:var(--panel);border-block:1px solid var(--line);overflow:hidden}
.wall-bar{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.era-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.era-chips::-webkit-scrollbar{display:none}
.era-chip{border:0;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;background:var(--c);color:var(--t)}
.era-chip:hover{filter:brightness(1.08)}
.nav{border:1px solid var(--line);background:var(--panel);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none;display:grid;place-items:center}
.nav:hover{background:var(--bg)}
.nav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2}
.wall-wrap{position:relative}
.wall-wrap::before,.wall-wrap::after{content:"";position:absolute;top:0;bottom:0;width:28px;z-index:2;pointer-events:none}
.wall-wrap::before{left:0;background:linear-gradient(90deg,var(--panel),transparent)}
.wall-wrap::after{right:0;background:linear-gradient(-90deg,var(--panel),transparent)}
.wall{display:flex;overflow-x:auto;overscroll-behavior-x:contain;padding-left:max(16px,env(safe-area-inset-left,0px))}
.wcol{flex:none;display:grid;grid-template-rows:40px 196px 196px 30px;padding:0 10px}
.wcol .wy{align-self:end;justify-self:start;border:0;background:none;padding:0 0 6px;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;cursor:pointer;letter-spacing:-.01em}
.wcol .wy:hover{text-decoration:underline}
.wcol.gap .wy{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim);cursor:default;text-decoration:none;writing-mode:vertical-rl;transform:rotate(180deg);padding:0;align-self:center;justify-self:center}
.wcol.gap{grid-template-rows:40px 392px 30px;padding:0 4px}
.wmusic{display:flex;align-items:flex-end;gap:10px}
.wmusic a{display:block;text-decoration:none;transition:transform .15s}
.wmusic a:hover{transform:translateY(-4px)}
.wmusic img{object-fit:cover;border-radius:2px;box-shadow:0 6px 16px var(--shade)}
.wmusic .e img{width:180px;height:180px}
.wmusic .g img{width:136px;height:136px}
.wmusic .d img{width:88px;height:88px;opacity:.7}
.wmusic .s img{width:100px;height:100px;border-radius:50%}
.wlife{display:flex;gap:10px;align-items:flex-start;padding-top:14px}
.wcard{width:164px;text-decoration:none;display:grid;gap:6px}
.wcard img{width:164px;height:112px;object-fit:cover;border-radius:6px}
.wcard span{font-size:12px;line-height:1.25;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wcard:hover span{color:var(--ink)}
.wcard i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;transform:translateY(-1px)}
.wband{background:var(--era);margin:0 -10px;position:relative}
.wcol.gap .wband{margin:0 -4px}
.wband span{position:absolute;left:9px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--display);font-weight:700;font-size:12.5px;color:var(--t);z-index:1}
.wall-legend{display:flex;flex-wrap:wrap;gap:4px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);font-size:12px;color:var(--sub)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:26px 6px}
.controls .lbl{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:999px;font-size:var(--fs-s);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.45}
.chip.ess[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.chip.ess[aria-pressed="false"]{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:var(--fs-s);align-items:center}

/* chronology */
.cols-head{display:grid;grid-template-columns:minmax(0,1.2fr) 76px minmax(0,1fr);gap:0 20px;padding-top:10px;font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cols-head span:last-child{grid-column:3}
.era{padding-top:28px}
.era-head{border-radius:12px;padding:20px 22px;background:color-mix(in srgb,var(--era) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--era) 45%,var(--line));display:grid;gap:8px;scroll-margin-top:16px}
.era-head{position:relative}
.era-tog{position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--era) 50%,var(--line));background:var(--panel);border-radius:999px;padding:5px 12px 5px 14px;font-size:12px;font-weight:600;cursor:pointer}
.era-tog:hover{background:color-mix(in srgb,var(--era) 25%,var(--panel))}
.era-tog svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;transition:transform .2s}
.era.closed .era-tog svg{transform:rotate(180deg)}
.era.closed .yr{display:none}
.era.closed .era-head p,.era.closed .era-head .who{display:none}
.era.closed .era-head{padding-block:16px;cursor:pointer}
.era-sum{display:none;text-transform:none;letter-spacing:0}
.era.closed .era-sum{display:inline}
.era-head h2{padding-right:120px}
.era-head .yrs{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.era-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);letter-spacing:-.025em;line-height:1;text-wrap:balance}
.era-head p{margin:0;max-width:72ch}
.who{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.who figure{margin:0;display:flex;align-items:center;gap:8px}
.who img,.who .ph{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 25%;flex:none;background:var(--line)}
.who .ph{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:var(--sub)}
.who figcaption{display:grid;line-height:1.2;font-size:13px;font-weight:600}
.who figcaption small{font-weight:400;color:var(--sub);font-size:11.5px}
.yr{display:grid;grid-template-columns:minmax(0,1.2fr) 76px minmax(0,1fr);gap:0 20px;scroll-margin-top:12px}
.yr .spine{position:relative;display:flex;justify-content:center}
.yr .spine::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
.yr .spine b{position:sticky;top:10px;align-self:start;margin-top:16px;background:var(--bg);padding:2px 4px;font-family:var(--display);font-weight:800;font-size:var(--fs-l);font-variant-numeric:tabular-nums;z-index:1}
.col{display:grid;gap:12px;align-content:start;padding-block:16px;min-width:0}

.album{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;scroll-margin-top:16px}
.album:target,.single:target,.ev:target{box-shadow:0 0 0 2px var(--era)}
.album .art img,.album .art .cover{width:300px;height:300px;object-fit:cover;border-radius:3px;box-shadow:0 8px 20px var(--shade)}
.album .meta{display:grid;gap:4px;align-content:start;min-width:0}
.album .type{font-family:var(--mono);font-size:var(--fs-xs);color:var(--sub)}
.album h3{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(19px,2.4vw,23px);letter-spacing:-.015em;line-height:1.12;text-wrap:balance}
.album p{margin:2px 0 0;color:var(--sub);font-size:var(--fs-s)}
.album .tracks{grid-column:1/-1}
.tier{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;justify-self:start;color:var(--dim)}
.tier.e{color:var(--ink);font-weight:500}
.tier.e::before{content:"●  ";color:var(--era)}
.album.d{grid-template-columns:160px minmax(0,1fr);padding:14px;background:transparent}
.album.d .art img,.album.d .art .cover{width:160px;height:160px}
.album.d h3{font-size:var(--fs-m)}
.cover{display:flex;flex-direction:column;justify-content:space-between;padding:8%}
.cover .ct{font-family:var(--display);font-weight:800;line-height:1;font-size:14px}

.single{border:1px dashed var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:160px minmax(0,1fr);gap:4px 18px;scroll-margin-top:16px}
.single img{width:160px;height:160px;border-radius:50%;object-fit:cover;grid-row:span 3;box-shadow:0 4px 12px var(--shade)}
.single .type{font-family:var(--mono);font-size:var(--fs-xs);color:var(--sub)}
.single h3{margin:0;font-family:var(--display);font-weight:700;font-size:var(--fs-l)}
.single p{margin:0;color:var(--sub);font-size:var(--fs-s)}
.single .tracks{grid-column:1/-1}

.tracks{display:grid;gap:2px;margin-top:4px;border-top:1px solid var(--line);padding-top:8px}
/* favourites */
.favwrap{padding-bottom:18px}
.favs{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.favs>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px 14px;padding:12px 16px;flex-wrap:wrap}
.favs>summary::-webkit-details-marker{display:none}
.favs .h{font-family:var(--display);font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px}
.favs .h svg{width:18px;height:18px;fill:var(--fav)}
.favs .cnt{color:var(--sub);font-size:var(--fs-s)}
.favs .thumbs{display:flex;gap:4px;margin-left:auto;min-width:0;overflow:hidden}
.favs .thumbs img{width:36px;height:36px;object-fit:cover;border-radius:2px;flex:none}
.favs .chev{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s}
.favs .chev svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4}
.favs[open] .chev{transform:rotate(180deg)}
.favbody{padding:0 16px 16px;display:grid;gap:16px;border-top:1px solid var(--line)}
.favnote{font-size:12px;color:var(--dim);padding-top:10px}
.favh{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.favgrid{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.favalb{flex:none;width:140px;display:grid;gap:5px;text-decoration:none}
.favalb img,.favalb .cover{width:140px;height:140px;object-fit:cover;border-radius:3px;box-shadow:0 6px 16px var(--shade)}
.favalb b{font-size:13px;line-height:1.2}
.favalb span{font-size:11.5px;color:var(--sub)}
.favalb:hover b{text-decoration:underline}
.favsongs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:0 28px}
.favsongs li{display:grid;grid-template-columns:auto 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.favsongs li img,.favsongs li .noimg{width:40px;height:40px;object-fit:cover;border-radius:2px;background:var(--line)}
.favsongs .go{text-decoration:none;font-weight:600;font-size:14px;display:block;line-height:1.25}
.favsongs .go:hover{text-decoration:underline}
.favsongs .ctx{display:block;font-size:12px;color:var(--sub)}
.favsongs .sp{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;white-space:nowrap}
.favsongs .sp:hover{color:var(--ink)}
.favempty{color:var(--sub);font-size:var(--fs-s);padding-top:12px}
.fav{border:0;background:none;padding:3px;cursor:pointer;color:var(--dim);display:inline-grid;place-items:center;border-radius:50%}
.fav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.fav:hover{color:var(--ink)}
.fav[aria-pressed="true"]{color:var(--fav)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.fav.lab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 8px;font-size:12px;color:var(--sub)}
.fav.lab svg{width:14px;height:14px}
.fav.lab[aria-pressed="true"]{border-color:var(--fav);color:var(--fav)}
.tierrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--fav)}100%{box-shadow:0 0 0 3px transparent}}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;padding:3px 0;font-size:var(--fs-s)}
.tr a{text-decoration:none;font-weight:600}
.tr a:hover{text-decoration:underline}
.tr .note{grid-column:2/-1;color:var(--sub);line-height:1.4}
.tracks .th,.full summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.full{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.full summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;color:var(--ink);padding:4px 0}
.full summary::-webkit-details-marker{display:none}
.full summary::before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);font-size:14px;letter-spacing:0;color:var(--ink)}
.full[open] summary::before{content:"−"}
.full summary span{color:var(--dim);text-transform:none;letter-spacing:0}
.full summary:hover::before{background:var(--line)}
.full ol{list-style:none;margin:8px 0 0;padding:0;display:grid}
.full li{display:grid;grid-template-columns:24px 24px minmax(0,1fr) auto 44px;gap:8px;align-items:baseline;padding:4px 0;font-size:var(--fs-s);border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.full li a{text-decoration:none;color:var(--sub)}
.full li a:hover{text-decoration:underline;color:var(--ink)}
.full li.key a{color:var(--ink);font-weight:600}
.full .no,.full .dur{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.full .no{text-align:right}
.full .dur{text-align:right}
.full li.med{display:block;border:0;padding:12px 0 2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--era)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:1px 7px;border-radius:3px;white-space:nowrap}
.tag.k{color:var(--sub);border:1px solid var(--line)}
.tag.m{background:var(--ink);color:var(--bg)}

.ev{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:var(--fs-s);scroll-margin-top:16px}
.ev.pic{gap:8px;margin-bottom:6px}
.ev.pic img{width:100%;max-width:100%;height:clamp(200px,24vw,330px);object-fit:cover;object-position:50% 30%;border-radius:8px;box-shadow:0 8px 22px var(--shade)}
.ev.world.pic{grid-template-columns:200px minmax(0,1fr);gap:6px 16px;align-items:start;margin-bottom:0}
.ev.world.pic img{width:200px;height:134px;aspect-ratio:auto;grid-row:span 2;filter:grayscale(1);opacity:.8;box-shadow:none}
.ev .kind{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.ev .when{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:8px;letter-spacing:0;text-transform:none}
.ev.world .txt{color:var(--sub);font-style:italic}
.ev .tracks{grid-column:1/-1}

footer{color:var(--dim);font-size:var(--fs-xs);padding-block:40px 60px}
footer p{margin:0 0 4px;max-width:90ch}
.credits{margin-top:14px}
.credits summary{cursor:pointer;color:var(--sub)}
.credits ul{columns:3 220px;column-gap:24px;padding-left:16px;margin:8px 0 0}
.credits li{break-inside:avoid;margin-bottom:2px}
.credits a{color:var(--sub)}

@media (max-width:1100px){ .album{grid-template-columns:220px minmax(0,1fr)} .album .art img,.album .art .cover{width:220px;height:220px} .ev.world.pic{grid-template-columns:140px minmax(0,1fr)} .ev.world.pic img{width:140px;height:94px} }
@media (max-width:900px){ header .wrap{grid-template-columns:1fr} .faces{overflow-x:auto} .faces img{width:88px;height:110px} }
@media (max-width:760px){
  .cols-head{display:none}
  .yr{grid-template-columns:1fr;gap:0}
  .yr .spine{justify-content:flex-start;order:-1}
  .yr .spine::before{display:none}
  .yr .spine b{position:static;margin-top:18px;padding:0;font-size:24px}
  .col{padding-block:8px}
  .col:empty{display:none}
  .album{grid-template-columns:1fr}
  .album .art img,.album .art .cover{width:100%;height:auto;aspect-ratio:1;max-width:480px}
  .album.d{grid-template-columns:120px minmax(0,1fr)}
  .album.d .art img,.album.d .art .cover{width:120px;height:120px}
  .single{grid-template-columns:110px minmax(0,1fr)} .single img{width:110px;height:110px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.wmusic a{transition:none}}
</style>
</head>
<body>

<header><div class="wrap" id="head"></div></header>
<section class="wrap favwrap" aria-label="My favourites"><details class="favs" id="favs"><summary id="favsum"></summary><div class="favbody" id="favbody"></div></details></section>
<main>
  <section class="wall-frame" aria-label="Career wall">
    <div class="wall-bar"><div class="era-chips" id="erachips"></div>
      <button class="nav" id="prev" aria-label="Scroll back in time"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="nav" id="next" aria-label="Scroll forward in time"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button></div>

/* ================= ARTIST DATA (one block per artist; the template below is shared) ================= */
const ARTIST = {
  slug:"bob-dylan",
  name:"Bob Dylan",
  search:"Bob Dylan",
  facts:["Born Robert Allen Zimmerman, Duluth, Minnesota, <b>1941</b>","<b>39</b> studio albums","Recording <b>1961–today</b>","Nobel Prize in Literature <b>2016</b>"],
  faces:["1963","1975","1978","1984","2012"],
  wallFrom:1959,
  eras:[
    {id:"prelude",name:"Hibbing to Minneapolis",from:1941,to:1960,color:"#a48a66",
     sound:"Before the records. A small-town kid hooked on Little Richard and Hank Williams, then on folk and Woody Guthrie.",
     people:[["Little Richard","teen idol"],["Woody Guthrie","the hero"]]},
    {id:"folk",name:"Folk Prophet",from:1961,to:1964,color:"#d9b23f",
     sound:"One man, acoustic guitar, harmonica rack. Guthrie-style talking blues turn into protest anthems, then into something more personal.",
     people:[["Joan Baez","duets, partner"],["Suze Rotolo","girlfriend, album cover"],["Pete Seeger","folk elder"],["John Hammond","signed him"],["Tom Wilson","producer"]]},
    {id:"electric",name:"Going Electric",from:1965,to:1966,color:"#ee6a3a",
     sound:"Full rock band, organ and electric guitar, long surreal lyrics. He later called it “that thin, that wild mercury sound.” Folk purists boo.",
     people:[["Mike Bloomfield","guitar"],["Al Kooper","organ"],["The Hawks","road band"],["Bob Johnston","producer"]]},
    {id:"woodstock",name:"Woodstock Retreat",from:1967,to:1969,color:"#8fb46a",
     sound:"After a motorcycle crash he disappears. Homemade basement tapes, then sparse biblical parables, then a smooth country croon.",
     people:[["The Band","Basement Tapes"],["Johnny Cash","duets"]]},
    {id:"drift",name:"Drift Years",from:1970,to:1973,color:"#b49c82",
     sound:"Covers, family life, a film soundtrack. Low ambition on record, though a couple of classics slip out.",
     people:[["George Harrison","friend, Bangladesh"],["Sam Peckinpah","film director"],["Leon Russell","producer"]]},
    {id:"confession",name:"Confession & Revue",from:1974,to:1978,color:"#5d9be0",
     sound:"Back on the road with The Band, then the great breakup album, then a travelling carnival with violin, Baez and white face paint.",
     people:[["The Band","Tour '74"],["Joan Baez","Rolling Thunder"],["Roger McGuinn","Rolling Thunder"],["Mick Ronson","guitar"],["Scarlet Rivera","violin"],["Emmylou Harris","harmonies"],["Allen Ginsberg","poet on tour"],["Jacques Levy","co-writer"]]},
    {id:"gospel",name:"Gospel Years",from:1979,to:1981,color:"#d0544f",
     sound:"Born-again Christian. Muscle Shoals soul-gospel with a choir of backing singers. For a while he plays only the new religious songs live.",
     people:[["Jerry Wexler","producer"],["Mark Knopfler","guitar"],["Clydie King","singer"]]},
    {id:"eighties",name:"Lost in the '80s",from:1982,to:1988,color:"#b07cd8",
     sound:"Glossy 80s production that rarely fits him. Great songs left in the vault, a supergroup holiday, and the start of the Never Ending Tour.",
     people:[["Mark Knopfler","producer"],["Sly and Robbie","rhythm section"],["Tom Petty","tour band"],["Grateful Dead","tour"],["Traveling Wilburys","supergroup"]]},
    {id:"roots",name:"Back to the Roots",from:1989,to:1996,color:"#4fa3a0",
     sound:"Daniel Lanois gives him a swampy, nocturnal New Orleans sound. Then two solo acoustic albums of old folk and blues songs reset his voice.",
     people:[["Daniel Lanois","producer"],["George Harrison","Wilburys"],["Tony Garnier","bass, 1989 on"]]},
    {id:"late",name:"Late Masterpieces",from:1997,to:2012,color:"#d6913f",
     sound:"A weathered growl over pre-war blues, rockabilly and swing. From 2001 he produces himself as “Jack Frost” with his road band.",
     people:[["Daniel Lanois","producer, 1997"],["Larry Campbell","guitar"],["Charlie Sexton","guitar"],["David Hidalgo","accordion, 2009"]]},
    {id:"songbook",name:"Sinatra Songbook",from:2013,to:2017,color:"#7f97bd",
     sound:"Five discs of standards associated with Frank Sinatra, cut live with his touring band and pedal steel. Croon, not growl.",
     people:[["Frank Sinatra","the source"],["Donnie Herron","pedal steel"]]},
    {id:"rowdy",name:"Rough and Rowdy",from:2018,to:2026,color:"#c94848",
     sound:"Hushed band, half-spoken vocals, very long songs packed with references. A Nobel laureate in his late seventies making one of his best records.",
     people:[["Blake Mills","guitar, 2020"],["Fiona Apple","piano, 2020"],["Willie Nelson","tour partner"],["Timothée Chalamet","plays him, 2024"]]}
  ],
  /* k: album | single | life | lineup | live | world | screen | award
     album kind: Studio | Live | Archival | Supergroup; tier: e essential, g worth it, d completists
     song tag: k = you have probably heard it (via = where from), m = should know; imp:2 = minor
     images: keyed by album title, event short, "p:<person>", "face:<year>" */
  events:[
    {d:"1941-05",k:"life",t:"Born Robert Allen Zimmerman in Duluth, Minnesota. At six the family moves to Hibbing, an iron-mining town near the Canadian border.",short:"Born in Duluth"},
    {d:"1959-06",k:"life",t:"Plays piano in high-school rock bands, pounding out Little Richard. His yearbook ambition: “to join Little Richard.”",imp:2,short:"High-school rock bands"},
    {d:"1959-09",k:"life",t:"Enrolls at the University of Minnesota, finds the Dinkytown folk scene, trades rock for folk and starts calling himself Bob Dylan.",short:"Becomes “Bob Dylan”"},
    {d:"1960",k:"life",t:"Reads Woody Guthrie's autobiography Bound for Glory and becomes obsessed with the voice, the clothes, the talking blues.",imp:2,short:"Discovers Woody Guthrie"},
    {d:"1960",k:"world",t:"Folk revival in full swing: the Kingston Trio, Joan Baez's debut album, coffeehouses in every college town.",short:"Folk revival"},

    {d:"1961-01",k:"life",t:"Arrives in New York in winter. Visits the dying Woody Guthrie in hospital and plays the Greenwich Village clubs, Café Wha? and Gerde's Folk City.",short:"Arrives in New York"},
    {d:"1961-05",k:"world",t:"Freedom Rides challenge segregation in the South. Civil rights becomes the subject of the new folk songs.",imp:2,short:"Freedom Rides"},
    {d:"1961-09",k:"life",t:"A rave New York Times review by Robert Shelton. John Hammond signs him to Columbia Records weeks later.",short:"Signed to Columbia"},
    {d:"1962-03",k:"album",kind:"Studio",title:"Bob Dylan",tier:"d",c:["#7a5a3a","#2b2420"],
     sound:"Mostly traditional folk and blues covers, sung in a young man's put-on old-man rasp. Only two originals. Sold about 5,000 copies in its first year.",
     songs:[{s:"Song to Woody",tag:"m",n:"One of the two originals, a letter to his hero."},{s:"House of the Risin' Sun",tag:"k",via:"via The Animals",n:"He took the arrangement from Dave Van Ronk. The Animals' 1964 hit followed it."}]},
    {d:"1962-04",k:"life",t:"Writes “Blowin' in the Wind,” by his account in about ten minutes.",imp:2,short:"Writes “Blowin' in the Wind”"},
    {d:"1962-06",k:"life",t:"Girlfriend Suze Rotolo leaves for Italy for months. The heartbreak runs through “Don't Think Twice” and “Boots of Spanish Leather.”",short:"Suze leaves for Italy"},
    {d:"1962-08",k:"life",t:"Legally changes his name to Bob Dylan.",short:"Legal name change"},
    {d:"1962-10",k:"world",t:"Cuban Missile Crisis. “A Hard Rain's a-Gonna Fall” was written weeks before but becomes tied to it.",short:"Cuban Missile Crisis"},
    {d:"1963-05",k:"album",kind:"Studio",title:"The Freewheelin' Bob Dylan",tier:"e",c:["#8f948f","#3e3226"],
     sound:"The breakthrough. Protest anthems, a tender breakup song, a nuclear-age nightmare, dry comic talking blues. The cover shows him and Suze Rotolo on snowy Jones Street.",
     songs:[{s:"Blowin' in the Wind",tag:"k",via:"via Peter, Paul and Mary",n:"Their version hit #2 in 1963 and made him famous as a writer first."},
            {s:"A Hard Rain's a-Gonna Fall",tag:"m",n:"Seven minutes of apocalyptic images. Patti Smith sang it at his Nobel ceremony."},
            {s:"Don't Think Twice, It's All Right",tag:"m",n:"The kiss-off as a shrug."},
            {s:"Masters of War",tag:"m",n:"The angriest song he ever wrote."},
            {s:"Girl from the North Country",tag:"m",n:"Redone with Johnny Cash in 1969."}]},
    {d:"1963-07",k:"lineup",t:"Newport Folk Festival. Joan Baez, already a star, brings him on stage. They become the king and queen of folk, and a couple, until 1965.",short:"Newport with Joan Baez"},
    {d:"1963-08",k:"world",t:"March on Washington. Dylan sings “Only a Pawn in Their Game” and, with Baez, “When the Ship Comes In,” hours before “I Have a Dream.”",short:"March on Washington"},
    {d:"1963-11",k:"world",t:"President Kennedy assassinated in Dallas. Dylan returns to it 57 years later in “Murder Most Foul.”",short:"JFK assassinated"},
    {d:"1964-01",k:"album",kind:"Studio",title:"The Times They Are a-Changin'",tier:"g",c:["#d6d6d6","#262626"],
     sound:"His bleakest, most topical record. Civil rights, poverty, murder, in stark black and white.",
     songs:[{s:"The Times They Are a-Changin'",tag:"k",via:"via Watchmen's opening titles",n:"The generational anthem."},
            {s:"The Lonesome Death of Hattie Carroll",tag:"m",n:"A true story: a Black barmaid killed by a rich young man who got six months. Every chorus turns."},
            {s:"Boots of Spanish Leather",tag:"",n:"Letters between two lovers across an ocean."}]},
    {d:"1964-02",k:"world",t:"The Beatles play The Ed Sullivan Show. Dylan hears where music is going.",short:"Beatles in America"},
    {d:"1964-08",k:"album",kind:"Studio",title:"Another Side of Bob Dylan",tier:"g",c:["#3a3a3a","#9a9a9a"],
     sound:"Cut in a single night. He drops politics for love songs, jokes and self-doubt. Folk fans start to worry.",
     songs:[{s:"It Ain't Me Babe",tag:"k",via:"via Johnny Cash & June Carter",n:""},
            {s:"My Back Pages",tag:"m",n:"“Ah, but I was so much older then, I'm younger than that now.” His exit from protest songs."},
            {s:"Chimes of Freedom",tag:"m",n:""}]},
    {d:"1964-08",k:"lineup",t:"Meets the Beatles at the Delmonico Hotel in New York. They start writing more personal lyrics. He starts thinking about a band.",short:"Meets the Beatles"},

    {d:"1965-03",k:"album",kind:"Studio",title:"Bringing It All Back Home",tier:"e",c:["#c9a56a","#2c3e50"],
     sound:"Side one electric, side two acoustic. Surreal, funny, beat-poetry lyrics. The bridge from folk to rock.",
     songs:[{s:"Subterranean Homesick Blues",tag:"k",via:"via the cue-card video",n:"Dylan flipping word cards in an alley, the opening of the film Dont Look Back."},
            {s:"Mr. Tambourine Man",tag:"k",via:"via The Byrds",n:"The Byrds' electric version went to #1 that June and launched folk rock."},
            {s:"It's All Over Now, Baby Blue",tag:"m",n:"A farewell, possibly to the folk scene."},
            {s:"It's Alright, Ma (I'm Only Bleeding)",tag:"m",n:"“Even the president of the United States sometimes must have to stand naked.”"},
            {s:"Maggie's Farm",tag:"",n:"Opened the Newport electric set."}]},
    {d:"1965-03",k:"world",t:"US combat troops land in Vietnam. The war becomes the backdrop to everything for a decade.",imp:2,short:"Vietnam escalates"},
    {d:"1965-05",k:"screen",t:"His UK tour is filmed by D. A. Pennebaker for Dont Look Back (1967). The last tour as a solo acoustic act.",short:"Dont Look Back filmed"},
    {d:"1965-06",k:"world",t:"The Byrds' “Mr. Tambourine Man” hits #1. Folk rock is born, from his song.",short:"Byrds #1, folk rock"},
    {d:"1965-07-20",k:"single",title:"Like a Rolling Stone",
     t:"Six minutes long when singles were three. Radio stations cut it in half. It still reaches #2.",
     songs:[{s:"Like a Rolling Stone",tag:"k",via:"via everywhere",n:"Al Kooper sneaked onto the organ uninvited. Rolling Stone named it the greatest song of all time in 2004."}]},
    {d:"1965-07-25",k:"live",t:"Newport Folk Festival. Plays loud and electric with members of the Paul Butterfield Blues Band. Booing, three songs, then back alone with an acoustic guitar. The moment the 2024 film A Complete Unknown is built around.",short:"Newport goes electric"},
    {d:"1965-08",k:"album",kind:"Studio",title:"Highway 61 Revisited",tier:"e",c:["#e07a2e","#284a78"],
     sound:"Full rock band: Al Kooper's organ, Mike Bloomfield's blues guitar. Long, sneering, hallucinatory songs about America. Often called his best album.",
     songs:[{s:"Like a Rolling Stone",tag:"k",via:"via everywhere",n:"Opens the album."},
            {s:"Ballad of a Thin Man",tag:"m",n:"“Something is happening here, but you don't know what it is, do you, Mr. Jones?”"},
            {s:"Highway 61 Revisited",tag:"m",n:"Abraham and Isaac on the blues highway, with a siren whistle."},
            {s:"Just Like Tom Thumb's Blues",tag:"",n:""},
            {s:"Desolation Row",tag:"m",n:"Eleven acoustic minutes. Einstein, Cinderella and the Titanic in one parade."}]},
    {d:"1965-09",k:"lineup",t:"Hires the Hawks as his road band: Robbie Robertson, Levon Helm, Rick Danko, Richard Manuel, Garth Hudson. Levon quits within months, tired of being booed every night.",short:"Hires the Hawks"},
    {d:"1965-11",k:"life",t:"Secretly marries Sara Lownds. They have four children together, among them Jakob Dylan of the Wallflowers, and he adopts her daughter Maria.",short:"Marries Sara Lownds"},
    {d:"1966-05-17",k:"live",t:"Manchester Free Trade Hall. A fan shouts “Judas!” Dylan answers “I don't believe you, you're a liar,” and tells the band to play it loud. Released in 1998 as Live 1966.",short:"“Judas!” in Manchester"},
    {d:"1966-05",k:"world",t:"Pet Sounds and Revolver come out. Pop albums become art statements, partly in Dylan's wake.",imp:2,short:"Pet Sounds, Revolver"},
    {d:"1966-06",k:"album",kind:"Studio",title:"Blonde on Blonde",tier:"e",c:["#8a6b4f","#2f251d"],
     sound:"Nashville session pros plus Al Kooper and Robbie Robertson, recorded through the night. Organ, harmonica, sleepy late-night grooves. One of rock's first double albums.",
     songs:[{s:"Rainy Day Women #12 & 35",tag:"k",via:"via “everybody must get stoned”",n:"A brass-band joke that became a hit."},
            {s:"Just Like a Woman",tag:"k",via:"via countless covers",n:""},
            {s:"I Want You",tag:"m",n:"Pure pop, three minutes."},
            {s:"Visions of Johanna",tag:"m",n:"Many fans' answer to “his best song.” Pure atmosphere."},
            {s:"Sad Eyed Lady of the Lowlands",tag:"m",n:"Takes all of side four, eleven minutes, for Sara."}]},
    {d:"1966-07",k:"life",t:"Motorcycle crash near Woodstock, New York. Tour cancelled. He vanishes from public life for 18 months and stays home with his young family.",short:"Motorcycle crash"},

    {d:"1967-06",k:"lineup",t:"The Basement Tapes. Daily sessions with the Hawks in the basement of Big Pink, a pink house in West Saugerties. Over 100 recordings of old folk songs and new ones. Bootlegged widely, officially out in 1975.",short:"Basement Tapes at Big Pink",
     songs:[{s:"I Shall Be Released",tag:"m",n:"The Band's version closes their first album."},
            {s:"This Wheel's on Fire",tag:"k",via:"via the Absolutely Fabulous theme",n:""},
            {s:"The Mighty Quinn (Quinn the Eskimo)",tag:"k",via:"via Manfred Mann",n:"A UK #1 in 1968."}]},
    {d:"1967-06",k:"world",t:"Summer of Love and Sgt. Pepper. Psychedelia everywhere. Dylan answers with the plainest record he could make.",short:"Summer of Love"},
    {d:"1967-10",k:"life",t:"Woody Guthrie dies. In January 1968 Dylan makes his first appearance since the crash at the Guthrie memorial concert at Carnegie Hall.",imp:2,short:"Woody Guthrie dies"},
    {d:"1967-12",k:"album",kind:"Studio",title:"John Wesley Harding",tier:"e",c:["#cfc6b0","#5f5a50"],
     sound:"Acoustic guitar, bass, drums, a little pedal steel. Short biblical parables and outlaw tales, released while everyone else went psychedelic.",
     songs:[{s:"All Along the Watchtower",tag:"k",via:"via Jimi Hendrix",n:"Hendrix's 1968 version is so good that Dylan has played it Hendrix's way ever since."},
            {s:"I'll Be Your Baby Tonight",tag:"m",n:"A hint of the country turn to come."},
            {s:"I Dreamed I Saw St. Augustine",tag:"",n:""}]},
    {d:"1968-04",k:"world",t:"Martin Luther King Jr. and Robert Kennedy assassinated. Riots, Paris in May, the Chicago convention.",imp:2,short:"MLK, RFK killed"},
    {d:"1968-07",k:"lineup",t:"The Hawks, now The Band, release Music from Big Pink. Dylan painted the cover and co-wrote three songs.",short:"The Band's debut"},
    {d:"1969-04",k:"album",kind:"Studio",title:"Nashville Skyline",tier:"g",c:["#6fa8dc","#efe7d2"],
     sound:"Full country, and a smooth new croon he credited to quitting smoking. Short, warm and happy. Fans who wanted a prophet are baffled.",
     songs:[{s:"Lay Lady Lay",tag:"k",via:"via the radio",n:"His last US top-10 single."},
            {s:"Girl from the North Country",tag:"m",n:"The duet with Johnny Cash."},
            {s:"I Threw It All Away",tag:"",n:""}]},
    {d:"1969-06",k:"screen",t:"Appears on The Johnny Cash Show.",short:"Johnny Cash Show"},
    {d:"1969-07",k:"world",t:"Moon landing. Woodstock festival. The decade ends.",imp:2,short:"Moon landing, Woodstock"},
    {d:"1969-08",k:"live",t:"Skips the Woodstock festival despite living nearby. Two weeks later headlines the Isle of Wight Festival in England.",short:"Isle of Wight"},

    {d:"1970-06",k:"album",kind:"Studio",title:"Self Portrait",tier:"d",c:["#b7472a","#d9c08c"],
     sound:"A double album of covers, oddities and rough live tracks, possibly made to shed the “spokesman” label. Greil Marcus's Rolling Stone review opened “What is this shit?”",
     songs:[{s:"Copper Kettle",tag:"",n:"Sounds better on the 2013 reissue, Another Self Portrait."}]},
    {d:"1970-06",k:"award",t:"Honorary doctorate from Princeton. Writes “Day of the Locusts” about it.",imp:2,short:"Princeton doctorate"},
    {d:"1970-10",k:"album",kind:"Studio",title:"New Morning",tier:"g",c:["#b9a37f","#4c3b2a"],
     sound:"A quick reassurance after Self Portrait. Piano-led, domestic, cheerful.",
     songs:[{s:"If Not for You",tag:"k",via:"via George Harrison",n:"Harrison covered it on All Things Must Pass the same year."},
            {s:"The Man in Me",tag:"k",via:"via The Big Lebowski",n:"Plays over the opening of the film."}]},
    {d:"1971-08",k:"live",t:"Concert for Bangladesh at Madison Square Garden, George Harrison's benefit. Dylan's surprise set is the highlight.",short:"Concert for Bangladesh"},
    {d:"1973-01",k:"world",t:"Watergate hearings, end of the US draft, oil crisis.",imp:2,short:"Watergate, oil crisis"},
    {d:"1973-07",k:"album",kind:"Studio",title:"Pat Garrett & Billy the Kid",tier:"g",c:["#c8a165","#5a3a1e"],
     sound:"Soundtrack for Sam Peckinpah's western, in which he also acts, as a character called Alias. Mostly instrumentals, and one standard.",
     songs:[{s:"Knockin' on Heaven's Door",tag:"k",via:"via Guns N' Roses",n:"A dying deputy's two verses. Covered by everyone."}]},
    {d:"1973-11",k:"album",kind:"Studio",title:"Dylan",tier:"d",c:["#6b6b8a","#2d2d3a"],
     sound:"Outtakes released by Columbia without his input after he left for Asylum Records. Widely seen as a spite release.",songs:[]},

    {d:"1974-01",k:"album",kind:"Studio",title:"Planet Waves",tier:"g",c:["#f2efe6","#1a1a1a"],
     sound:"Recorded in three days with The Band. Loose, warm and domestic. His first #1 album in the US.",
     songs:[{s:"Forever Young",tag:"k",via:"via lullabies and graduations",n:"Written for his kids. Two versions on the album."},
            {s:"Going, Going, Gone",tag:"",n:""}]},
    {d:"1974-01",k:"live",t:"Tour '74 with The Band, his first tour in eight years. Huge demand, mostly loud and fast. Live album Before the Flood.",short:"Tour '74 with The Band"},
    {d:"1974-08",k:"world",t:"Nixon resigns. Dylan records a breakup album in New York that September.",short:"Nixon resigns"},
    {d:"1975-01",k:"album",kind:"Studio",title:"Blood on the Tracks",tier:"e",c:["#c75b2b","#3a1f14"],
     sound:"Mostly acoustic and devastating, recorded as his marriage fell apart. He denies it is autobiographical; his son Jakob said it is his parents talking. Half was re-recorded in Minneapolis at the last minute.",
     songs:[{s:"Tangled Up in Blue",tag:"m",n:"A love story told out of order across years and cities. He keeps rewriting it on stage."},
            {s:"Simple Twist of Fate",tag:"m",n:""},
            {s:"Idiot Wind",tag:"m",n:"Pure venom, then a final twist that turns it on himself."},
            {s:"You're a Big Girl Now",tag:"",n:""},
            {s:"Shelter from the Storm",tag:"m",n:""}]},
    {d:"1975-06",k:"album",kind:"Studio",title:"The Basement Tapes",tier:"g",c:["#6b7d3a","#25251b"],
     sound:"The 1967 Big Pink recordings with The Band, officially released eight years late (with some Band-only tracks added). Ramshackle, funny, haunted.",
     songs:[{s:"You Ain't Goin' Nowhere",tag:"k",via:"via The Byrds",n:""},
            {s:"Goin' to Acapulco",tag:"m",n:""},
            {s:"Tears of Rage",tag:"",n:""}]},
    {d:"1975-10",k:"live",t:"Rolling Thunder Revue. A travelling circus playing small halls: Baez, Roger McGuinn, Mick Ronson, Ramblin' Jack Elliott, Allen Ginsberg, Scarlet Rivera. Dylan in white face paint. Scorsese's 2019 film of it mixes fact and fiction on purpose.",short:"Rolling Thunder Revue"},
    {d:"1975-12",k:"live",t:"Night of the Hurricane benefit at Madison Square Garden for the jailed boxer Rubin Carter.",imp:2,short:"Night of the Hurricane"},
    {d:"1976-01",k:"album",kind:"Studio",title:"Desire",tier:"e",c:["#6a4a2f","#c9a77c"],
     sound:"Gypsy violin from Scarlet Rivera, Emmylou Harris harmonies, long story songs co-written with theatre director Jacques Levy. Five weeks at #1.",
     songs:[{s:"Hurricane",tag:"k",via:"via the radio",n:"The case of boxer Rubin “Hurricane” Carter, wrongly convicted of triple murder. Freed in 1985."},
            {s:"One More Cup of Coffee (Valley Below)",tag:"m",n:"Eerie, minor-key, Emmylou's harmony."},
            {s:"Isis",tag:"m",n:"A mythic quest-for-love story."},
            {s:"Sara",tag:"m",n:"A direct, naked plea to his wife."}]},
    {d:"1976-05",k:"live",t:"Hard Rain, a TV special filmed in pouring rain in Fort Collins, Colorado. The second Rolling Thunder leg, angrier than the first.",imp:2,short:"Hard Rain TV special"},
    {d:"1976-11",k:"live",t:"The Last Waltz, The Band's farewell concert, filmed by Scorsese. Dylan closes the show.",short:"The Last Waltz"},
    {d:"1977-06",k:"life",t:"Divorce from Sara finalized after a bitter custody fight.",short:"Divorce"},
    {d:"1977-08",k:"world",t:"Elvis dies. Punk breaks in London and New York. Dylan is suddenly the old guard.",imp:2,short:"Elvis dies, punk"},
    {d:"1978-01",k:"screen",t:"Renaldo and Clara, his four-hour film from the Rolling Thunder tour, flops.",imp:2,short:"Renaldo and Clara"},
    {d:"1978-06",k:"album",kind:"Studio",title:"Street-Legal",tier:"g",c:["#3c4a5a","#c9b48a"],
     sound:"Big band with horns and gospel backing singers. Dense and apocalyptic, with a murky original mix (fixed in 1999).",
     songs:[{s:"Changing of the Guards",tag:"m",n:""},
            {s:"Señor (Tales of Yankee Power)",tag:"m",n:""}]},
    {d:"1978-11",k:"life",t:"Someone throws a small silver cross on stage in San Diego; he picks it up. Weeks later he becomes a born-again Christian and attends Bible classes.",short:"Born-again Christian"},

    {d:"1979-08",k:"album",kind:"Studio",title:"Slow Train Coming",tier:"g",c:["#7a5c3a","#d9b77a"],
     sound:"Muscle Shoals soul production by Jerry Wexler, Mark Knopfler on guitar. Fierce, preachy and very well played.",
     songs:[{s:"Gotta Serve Somebody",tag:"m",n:"Won a Grammy. John Lennon wrote a parody, “Serve Yourself.”"},
            {s:"Slow Train",tag:"m",n:""},
            {s:"I Believe in You",tag:"",n:""}]},
    {d:"1979-11",k:"live",t:"Gospel tour. He plays only new religious songs and preaches between them. Bootleg Series Vol. 13 (2017) shows how ferocious the band was.",short:"Gospel-only tour"},
    {d:"1980-06",k:"album",kind:"Studio",title:"Saved",tier:"d",c:["#c0392b","#f5d7a1"],sound:"Second gospel album. Choir, organ, testimony.",
     songs:[{s:"Pressing On",tag:"",n:""}]},
    {d:"1981-08",k:"album",kind:"Studio",title:"Shot of Love",tier:"d",c:["#e84a8a","#f2c14e"],
     sound:"The gospel period winds down. Uneven, with one of his greatest songs at the end.",
     songs:[{s:"Every Grain of Sand",tag:"m",n:"A hymn about doubt and grace. Many put it in his top ten."}]},
    {d:"1981-08",k:"world",t:"MTV launches. Music becomes a video medium, and he never quite gets the hang of it.",imp:2,short:"MTV launches"},

    {d:"1983-10",k:"album",kind:"Studio",title:"Infidels",tier:"g",c:["#2f2f2f","#c2b280"],
     sound:"Produced by Mark Knopfler, with Sly Dunbar and Robbie Shakespeare on rhythm and Mick Taylor on guitar. Clean 80s sound. He left the best song off.",
     songs:[{s:"Jokerman",tag:"m",n:""},
            {s:"I and I",tag:"",n:""},
            {s:"Blind Willie McTell",tag:"m",n:"Cut from the album. Released in 1991 and now considered a masterpiece."}]},
    {d:"1984-06",k:"live",t:"European stadium tour with Santana, with Mick Taylor in his band. Joan Baez joins for some shows and leaves early.",short:"European tour with Santana"},
    {d:"1985-06",k:"album",kind:"Studio",title:"Empire Burlesque",tier:"d",c:["#3a4a6a","#d4a373"],
     sound:"Mixed by dance producer Arthur Baker. Gated drums and synths. Ends with a beautiful solo acoustic song.",
     songs:[{s:"Dark Eyes",tag:"m",n:"Just voice, guitar and harmonica."}]},
    {d:"1985-07",k:"live",t:"Live Aid. A shambolic acoustic set with Keith Richards and Ron Wood. His remark about American farmers inspires Farm Aid.",short:"Live Aid"},
    {d:"1985-11",k:"album",kind:"Archival",title:"Biograph",tier:"d",c:["#1c1c1c","#cfcfcf"],
     sound:"Five-LP retrospective with unreleased songs. It helps invent the career box set.",
     songs:[{s:"Caribbean Wind",tag:"",n:"A famous lost song from 1980."}]},
    {d:"1986-02",k:"lineup",t:"Tours with Tom Petty and the Heartbreakers through 1987.",short:"Tours with Tom Petty"},
    {d:"1986-07",k:"album",kind:"Studio",title:"Knocked Out Loaded",tier:"d",c:["#c94f3d","#f2c879"],
     sound:"Scrappy and padded with covers, except for one eleven-minute epic.",
     songs:[{s:"Brownsville Girl",tag:"m",n:"Co-written with playwright Sam Shepard. A movie remembered in a car."}]},
    {d:"1987-07",k:"lineup",t:"Short stadium tour with the Grateful Dead.",short:"Tour with the Grateful Dead"},
    {d:"1987-10",k:"live",t:"Near burnout. At an outdoor show in Locarno, Switzerland, he loses his voice and, by his account in Chronicles, finds a new way to sing his old songs. He decides to keep touring.",short:"Locarno turning point"},
    {d:"1988-01",k:"award",t:"Inducted into the Rock and Roll Hall of Fame. Bruce Springsteen: “Bob freed your mind the way Elvis freed your body.”",short:"Rock Hall of Fame"},
    {d:"1988-05",k:"album",kind:"Studio",title:"Down in the Groove",tier:"d",c:["#1f3b5a","#8fa8c0"],sound:"Covers and leftovers. His lowest seller.",
     songs:[{s:"Silvio",tag:"",n:"Co-written with Grateful Dead lyricist Robert Hunter."}]},
    {d:"1988-06",k:"live",t:"The Never Ending Tour begins in Concord, California. Around 100 shows a year for the next three decades.",short:"Never Ending Tour starts"},
    {d:"1988-10",k:"album",kind:"Supergroup",title:"Traveling Wilburys Vol. 1",tier:"g",c:["#b08d57","#2f2a24"],
     sound:"George Harrison, Jeff Lynne, Roy Orbison, Tom Petty and Dylan as fake half-brothers, recorded for fun in a few weeks.",
     songs:[{s:"Handle with Care",tag:"k",via:"via classic-rock radio",n:""},
            {s:"Tweeter and the Monkey Man",tag:"m",n:"Dylan's playful take on Springsteen song titles."},
            {s:"End of the Line",tag:"",n:""}]},

    {d:"1989-09",k:"album",kind:"Studio",title:"Oh Mercy",tier:"e",c:["#e0c34a","#6f5326"],
     sound:"Produced by Daniel Lanois in New Orleans. Swampy, nocturnal, atmospheric. His first strong album in years.",
     songs:[{s:"Most of the Time",tag:"m",n:""},
            {s:"Man in the Long Black Coat",tag:"m",n:"Crickets, fog, a woman who leaves. Pure Lanois mood."},
            {s:"Everything Is Broken",tag:"",n:""},
            {s:"Ring Them Bells",tag:"",n:""}]},
    {d:"1989-11",k:"world",t:"Berlin Wall falls.",imp:2,short:"Berlin Wall falls"},
    {d:"1990-09",k:"album",kind:"Studio",title:"Under the Red Sky",tier:"d",c:["#b23a2a","#3a2a20"],
     sound:"Nursery-rhyme songs with star guests: George Harrison, Slash, Elton John, Stevie Ray Vaughan.",
     songs:[{s:"Born in Time",tag:"",n:""}]},
    {d:"1991-02",k:"award",t:"Grammy Lifetime Achievement Award during the Gulf War. He plays a fast, garbled “Masters of War.”",short:"Lifetime Grammy"},
    {d:"1991-03",k:"album",kind:"Archival",title:"The Bootleg Series Volumes 1–3",tier:"g",c:["#4a3b2c","#d9c7a4"],
     sound:"Thirty years of outtakes, the first of a long archival series. Proof that what he left off often beat what he put out.",
     songs:[{s:"Blind Willie McTell",tag:"m",n:""}]},
    {d:"1992-10",k:"live",t:"30th Anniversary Concert at Madison Square Garden. Neil Young, Eric Clapton, George Harrison, Stevie Wonder and others sing his songs.",imp:2,short:"30th Anniversary Concert"},
    {d:"1992-11",k:"album",kind:"Studio",title:"Good as I Been to You",tier:"d",c:["#6b4e3a","#d8c3a5"],sound:"Solo acoustic: old folk and blues songs, nothing new. He is going back to the source.",
     songs:[{s:"Arthur McBride",tag:"",n:""}]},
    {d:"1993-10",k:"album",kind:"Studio",title:"World Gone Wrong",tier:"g",c:["#2f3a2f","#a68a5b"],sound:"More solo acoustic traditional songs, darker, with his own odd liner notes. The voice is turning into the late growl.",
     songs:[{s:"Delia",tag:"",n:""},{s:"Blood in My Eyes",tag:"",n:""}]},
    {d:"1994-11",k:"live",t:"MTV Unplugged taping; the album comes out in 1995. A well-received set at Woodstock '94 the summer before.",short:"MTV Unplugged"},

    {d:"1997-05",k:"life",t:"Hospitalized with a heart infection (pericarditis from histoplasmosis). “I really thought I'd be seeing Elvis soon.”",short:"Heart infection"},
    {d:"1997-09",k:"live",t:"Plays for Pope John Paul II in Bologna.",imp:2,short:"Plays for the Pope"},
    {d:"1997-09",k:"album",kind:"Studio",title:"Time Out of Mind",tier:"e",c:["#3a3530","#8a7a60"],
     sound:"Lanois again. Murky, echoing, haunted blues about age, love and death. His big late comeback, and Album of the Year at the Grammys.",
     songs:[{s:"Love Sick",tag:"m",n:""},
            {s:"Make You Feel My Love",tag:"k",via:"via Adele",n:"Billy Joel and Garth Brooks covered it first. Adele's 2008 version made it a modern standard."},
            {s:"Not Dark Yet",tag:"m",n:"“It's not dark yet, but it's getting there.”"},
            {s:"Cold Irons Bound",tag:"",n:""},
            {s:"Highlands",tag:"m",n:"Sixteen minutes, mostly a funny conversation with a waitress."}]},
    {d:"1998-02",k:"award",t:"Grammy Album of the Year. A shirtless stage-crasher with “Soy Bomb” on his chest dances next to him on live TV.",imp:2,short:"Album of the Year"},
    {d:"1998-10",k:"album",kind:"Live",title:"Live 1966 (The “Royal Albert Hall” Concert)",tier:"e",c:["#141414","#e8e8e8"],
     sound:"The Manchester “Judas!” show, finally official. Acoustic first half, savage electric second half with the Hawks. Mislabelled by bootleggers for 30 years.",
     songs:[{s:"Like a Rolling Stone",tag:"",n:"Hear the “Judas!” exchange right before it."}]},
    {d:"2000-05",k:"single",title:"Things Have Changed",t:"Written for the film Wonder Boys. Wins the Oscar and the Golden Globe for Best Original Song.",
     songs:[{s:"Things Have Changed",tag:"m",n:"“People are crazy and times are strange.”"}]},
    {d:"2001-09-11",k:"album",kind:"Studio",title:"“Love and Theft”",tier:"e",c:["#b8b0a0","#2b2b2b"],
     sound:"Self-produced as “Jack Frost” with his road band. Old-time pop, jump blues, rockabilly, Western swing, packed with borrowed lines. Released on 9/11.",
     songs:[{s:"Mississippi",tag:"m",n:"Left off Time Out of Mind, recorded first by Sheryl Crow."},
            {s:"High Water (For Charley Patton)",tag:"m",n:"A banjo-driven flood song."},
            {s:"Summer Days",tag:"",n:""},
            {s:"Sugar Baby",tag:"",n:""}]},
    {d:"2001-09",k:"world",t:"September 11 attacks, the day the album comes out.",short:"9/11"},
    {d:"2004-10",k:"life",t:"Chronicles: Volume One, a memoir that skips most of the famous parts and lingers on 1961 New York, 1970 and 1987. A bestseller.",short:"Chronicles memoir"},
    {d:"2005-09",k:"screen",t:"No Direction Home, Martin Scorsese's documentary about 1961 to 1966.",short:"No Direction Home"},
    {d:"2006-05",k:"life",t:"Theme Time Radio Hour: he becomes a satellite-radio DJ for 100 episodes, playing old records by theme.",short:"Becomes a radio DJ"},
    {d:"2006-08",k:"album",kind:"Studio",title:"Modern Times",tier:"g",c:["#1e3a5f","#7fa1c3"],
     sound:"Same road-band sound, smoother. At 65 he is the oldest living artist to that date to top the US album chart, his first #1 since Desire.",
     songs:[{s:"Thunder on the Mountain",tag:"m",n:"Name-checks Alicia Keys."},
            {s:"Workingman's Blues #2",tag:"m",n:""},
            {s:"Nettie Moore",tag:"m",n:""},
            {s:"Ain't Talkin'",tag:"",n:""}]},
    {d:"2007-11",k:"screen",t:"I'm Not There, Todd Haynes's film in which six actors play versions of him. Cate Blanchett is nominated for an Oscar.",imp:2,short:"I'm Not There"},
    {d:"2008-04",k:"award",t:"Pulitzer Prize special citation for his “profound impact on popular music and American culture.”",imp:2,short:"Pulitzer citation"},
    {d:"2009-04",k:"album",kind:"Studio",title:"Together Through Life",tier:"d",c:["#3a3a3a","#c8c0b0"],
     sound:"Accordion (David Hidalgo of Los Lobos) and Tex-Mex border blues, co-written with Robert Hunter. #1 in the US and UK.",
     songs:[{s:"Beyond Here Lies Nothin'",tag:"",n:""}]},
    {d:"2009-10",k:"album",kind:"Studio",title:"Christmas in the Heart",tier:"d",c:["#2c5f3a","#c0392b"],
     sound:"Christmas standards, sung completely straight in the growl. Royalties go to hunger charities.",
     songs:[{s:"Must Be Santa",tag:"",n:"A polka, with a deranged party video."}]},
    {d:"2012-05",k:"award",t:"Presidential Medal of Freedom.",short:"Medal of Freedom"},
    {d:"2012-09",k:"album",kind:"Studio",title:"Tempest",tier:"g",c:["#7a1f1f","#d8c3a5"],
     sound:"Darker and violent: murder ballads, a 14-minute Titanic song, an elegy for John Lennon.",
     songs:[{s:"Duquesne Whistle",tag:"m",n:""},
            {s:"Pay in Blood",tag:"m",n:""},
            {s:"Tempest",tag:"",n:"45 verses on the Titanic, with Leonardo DiCaprio in it."},
            {s:"Roll On John",tag:"",n:""}]},

    {d:"2015-02",k:"album",kind:"Studio",title:"Shadows in the Night",tier:"g",c:["#111111","#e8e8e8"],
     sound:"Ten songs Sinatra sang, cut live around one microphone. Tender and surprisingly well sung.",
     songs:[{s:"The Night We Called It a Day",tag:"m",n:""},{s:"Full Moon and Empty Arms",tag:"",n:""}]},
    {d:"2016-05",k:"album",kind:"Studio",title:"Fallen Angels",tier:"d",c:["#222222","#b8a070"],sound:"More of the same Songbook approach.",
     songs:[{s:"Young at Heart",tag:"",n:""}]},
    {d:"2016-10",k:"award",t:"Nobel Prize in Literature, “for having created new poetic expressions within the great American song tradition.” Silent for two weeks, skips the ceremony. Patti Smith sings “A Hard Rain's a-Gonna Fall” in his place and stumbles on the words.",short:"Nobel Prize"},
    {d:"2017-03",k:"album",kind:"Studio",title:"Triplicate",tier:"d",c:["#2c2c2c","#bfa26a"],sound:"Three discs, thirty more standards. The end of the Songbook phase.",
     songs:[{s:"Stormy Weather",tag:"",n:""}]},
    {d:"2017-06",k:"award",t:"Delivers his Nobel lecture as a recording: on Buddy Holly, Moby-Dick, All Quiet on the Western Front and the Odyssey.",imp:2,short:"Nobel lecture"},

    {d:"2019-06",k:"screen",t:"Rolling Thunder Revue: A Bob Dylan Story by Martin Scorsese, with invented characters mixed into real footage.",short:"Scorsese's Rolling Thunder film"},
    {d:"2020-03",k:"single",title:"Murder Most Foul",t:"Dropped without warning in the first weeks of lockdown. Seventeen minutes on the JFK assassination and a whole catalogue of American songs. His first song ever to top a Billboard chart.",
     songs:[{s:"Murder Most Foul",tag:"m",n:"Piano, violin, soft drums, and his voice reciting."}]},
    {d:"2020-03",k:"world",t:"COVID-19 pandemic. Touring stops worldwide.",short:"Pandemic"},
    {d:"2020-06-19",k:"album",kind:"Studio",title:"Rough and Rowdy Ways",tier:"e",c:["#8a1c1c","#181818"],
     sound:"Hushed band, half-spoken vocals, long songs dense with references from Indiana Jones to Anne Frank. Made at 79. His best-reviewed album in decades.",
     songs:[{s:"I Contain Multitudes",tag:"m",n:"The title is a Walt Whitman line."},
            {s:"False Prophet",tag:"m",n:"A bluesy boast built on an old Billy “The Kid” Emerson riff."},
            {s:"My Own Version of You",tag:"",n:""},
            {s:"Key West (Philosopher Pirate)",tag:"m",n:"Nine dreamy minutes, accordion and radio."},
            {s:"Murder Most Foul",tag:"m",n:"Takes up the whole second disc."}]},
    {d:"2020-12",k:"life",t:"Sells his entire songwriting catalogue to Universal Music Publishing, reportedly for over $300 million. Sells his recordings to Sony in 2022.",short:"Sells his catalogue"},
    {d:"2021-07",k:"screen",t:"Shadow Kingdom, a streamed black-and-white film of early songs reworked in a smoky club set.",imp:2,short:"Shadow Kingdom"},
    {d:"2021-11",k:"live",t:"Rough and Rowdy Ways tour begins. Phones locked in pouches, the setlist mostly the new album.",short:"Rough and Rowdy tour"},
    {d:"2022-11",k:"life",t:"The Philosophy of Modern Song, a book of 66 short essays on other people's songs.",short:"Philosophy of Modern Song"},
    {d:"2023-01",k:"album",kind:"Archival",title:"Fragments: Time Out of Mind Sessions",tier:"g",c:["#4a4238","#a8987a"],
     sound:"Bootleg Series Vol. 17. Includes a remix of Time Out of Mind without Lanois's fog, so you can compare.",songs:[]},
    {d:"2024-06",k:"live",t:"Outlaw Music Festival tour with Willie Nelson, and again in 2025.",short:"Tour with Willie Nelson"},
    {d:"2024-12",k:"screen",t:"A Complete Unknown, James Mangold's film of 1961 to Newport 1965. Timothée Chalamet plays Dylan and sings the songs himself. Eight Oscar nominations.",short:"A Complete Unknown"}
  ],

(function(){
const A = ARTIST;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = d => { const p = d.split("-"); return p[1] ? MON[+p[1]-1] + (p[2] ? " " + (+p[2]) : "") : ""; };
const yearOf = d => +d.slice(0,4);
const spot = s => "https://open.spotify.com/search/" + encodeURIComponent(A.search + " " + s);

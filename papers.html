<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Newsreader:opsz,wght@6..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf5ec;--ink:#181410;--faint:#6f6353;--rule:#d8cdbb;--accent:#bc3417;--accent-2:#274690;--hl:#f3e8cf}
@media(prefers-color-scheme:dark){:root{--paper:#161310;--ink:#ece4d4;--faint:#9c8f7a;--rule:#3a332a;--accent:#e8603f;--accent-2:#7d9be0;--hl:#2a241b}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:48px 20px 90px}
.overline{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.overline .priv{color:var(--accent)}
h1{font-family:"Fraunces",serif;font-weight:850;font-size:clamp(38px,7vw,66px);line-height:.98;letter-spacing:-.02em;margin:.2em 0 .1em}
.standfirst{font-style:italic;color:var(--faint);margin:0 0 20px}
hr.a{border:0;border-top:3px solid var(--ink);margin:0 0 2px}hr.b{border:0;border-top:1px solid var(--ink);margin:0 0 24px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px;margin-bottom:26px}
.controls input,.controls select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--rule);padding:7px 10px;min-width:170px}
.count{margin-left:auto;color:var(--faint)}
/* roster strip */
.roster{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.rosterhead{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:.5em}
.rosterhead:hover{color:var(--accent)}
.rosterhead .caret{transition:transform .15s;font-size:9px}
.rgroup.collapsed .caret{transform:rotate(-90deg)}
.rgroup.collapsed .roster{display:none}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);padding:4px 9px 4px 4px;cursor:pointer;background:none;font:inherit;font-size:13px;color:var(--ink)}
.chip:hover,.chip.on{border-color:var(--accent);background:var(--hl)}
.chip.following{border-style:dashed}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);padding:1px 5px;color:var(--faint);margin-left:.5em;vertical-align:.12em}
.tag.met{color:var(--accent);border-color:var(--accent)}
.month{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:14px;margin:40px 0 6px}
.month::after{content:"";flex:1;border-top:1px solid var(--rule)}
ol{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:auto 1fr;gap:0 16px;padding:16px 4px;border-bottom:1px solid var(--rule)}
.face,.mono{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.mono{display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.02em;color:var(--paper)}
.faces{display:flex;flex-direction:column;gap:6px;align-items:center}
h2{font-family:"Fraunces",serif;font-weight:640;font-size:20px;line-height:1.25;margin:0 0 5px}
h2 a{color:inherit;text-decoration:none}h2 a:hover{color:var(--accent)}
.byline{font-size:15px;color:var(--faint);margin:0 0 6px}
.byline .met{color:var(--ink);background:var(--hl);padding:0 .25em;box-shadow:inset 0 -2px 0 var(--accent)}
.byline .via{font-style:italic}
.meta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);display:flex;gap:1.3em;flex-wrap:wrap}
.meta .venue{text-transform:uppercase;letter-spacing:.13em}
.meta a{color:var(--accent-2);text-decoration:none}.meta a.alpha{color:var(--accent);font-weight:500}
.meta a:hover{text-decoration:underline}
.empty{font-family:"IBM Plex Mono",monospace;color:var(--faint);padding:50px 0;text-align:center}
footer{margin-top:56px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
@media(max-width:560px){.entry{grid-template-columns:1fr}.faces{flex-direction:row;justify-content:flex-start;margin-bottom:8px}}
/* private note card — right-click a face; passphrase-locked, decrypted in-browser */
#notecard{position:fixed;z-index:50;max-width:340px;width:min(340px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.16);padding:14px 15px;font-size:14px;line-height:1.42;display:none}
#notecard.show{display:block}
#notecard h3{font-family:"Fraunces",serif;font-weight:640;font-size:18px;margin:0 0 2px}
#notecard .nc-sub{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
#notecard .nc-row{margin:8px 0}
#notecard .nc-k{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:1px}
#notecard .nc-v{white-space:pre-wrap}
#notecard .nc-lock{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint);line-height:1.5}
#notecard input[type=password]{font-family:"IBM Plex Mono",monospace;font-size:13px;width:100%;padding:7px 9px;margin:9px 0 7px;border:1px solid var(--rule);background:transparent;color:var(--ink)}
#notecard button.nc-go{font-family:"IBM Plex Mono",monospace;font-size:12px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:6px 13px}
#notecard .nc-err{color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:7px;min-height:1em}
#notecard .nc-hint{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--faint);margin-top:9px;letter-spacing:.02em}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const q=document.getElementById('q'),who=document.getElementById('who'),count=document.getElementById('count'),
      list=document.getElementById('list'),roster=document.getElementById('roster'),
      rel=document.getElementById('rel'),lim=document.getElementById('lim');
// Three date precisions: exact month, year-only, unknown. Never invent a month.
function bucket(p){
  if(p.date){const d=new Date(p.date);
    return {key:p.date, label:MONTHS[d.getMonth()]+' '+d.getFullYear(), shown:p.date};}
  if(p.year) return {key:p.year+'-00', label:p.year+' · month unknown', shown:String(p.year)};
  return {key:'', label:'Date unknown', shown:''};
}
const papers=DATA.papers.map(p=>({...p,b:bucket(p)}))
  .sort((a,b)=>b.b.key.localeCompare(a.b.key));
const photos=DATA.photos||{};
const people=[...new Set(papers.flatMap(p=>p.met))].sort();
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function mono(name,cls){
  const init=name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return `<span class="mono ${cls||''}" style="background:hsl(${hue(name)} 42% 42%)" title="${name}">${init}</span>`;
}
function avatar(name,cls){
  const src=photos[name];
  if(!src) return mono(name,cls);
  // Fall back to a monogram if the image 404s, never show a broken-image icon.
  return `<img class="face ${cls||''}" src="${src}" alt="${name}" title="${name}" loading="lazy" `
    + `onerror="this.outerHTML=this.getAttribute('data-fallback')" `
    + `data-fallback="${mono(name,cls).replace(/"/g,'&quot;')}">`;
}
const rels=DATA.rels||{};
people.forEach(n=>who.append(new Option(n,n)));
const chip=n=>`<button class="chip ${rels[n]}" data-n="${n}">${avatar(n)}${n}</button>`;
const group=(label,list)=>list.length?`<section class="rgroup"><button class="rosterhead" type="button" aria-expanded="true">${label} · ${list.length} <span class="caret">\u25be</span></button>
  <div class="roster">${list.map(chip).join('')}</div></section>`:'';
roster.outerHTML=group('Interacted with',people.filter(n=>rels[n]==='met'))
                +group('Following',people.filter(n=>rels[n]!=='met'));
document.addEventListener('click',e=>{
  const h=e.target.closest('.rosterhead');
  if(h){const g=h.closest('.rgroup');const c=g.classList.toggle('collapsed');h.setAttribute('aria-expanded',String(!c));return;}
  const b=e.target.closest('.chip');if(!b)return;
  who.value=(who.value===b.dataset.n)?'':b.dataset.n;render();});
function markMet(authors,met){
  let out=authors||'';const missing=[];
  met.forEach(name=>{const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const sur=name.trim().split(/\s+/).pop();
    let re=new RegExp(esc(name),'i'); if(!re.test(out)) re=new RegExp("[\\w.'-]+\\s+"+esc(sur),'i');
    if(re.test(out)) out=out.replace(re,m=>`<span class="met">${m}</span>`); else missing.push(name);});
  if(missing.length) out += (out?' ':'')+`<span class="via">— via ${missing.map(n=>`<span class="met">${n}</span>`).join(', ')}</span>`;
  met.forEach(n=>{if(rels[n]!=='met') return;});
  return out;
}
function render(){
  const t=q.value.toLowerCase(),person=who.value,relf=rel.value,cap=parseInt(lim.value,10)||0;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.n===person));
  const matched=papers.filter(p=>
    (!relf||p.met.some(n=>(rels[n]||'following')===relf))&&
    (!person||p.met.includes(person))&&
    (!t||(p.title+' '+p.authors).toLowerCase().includes(t)));
  const shown=cap?matched.slice(0,cap):matched;
  count.textContent=shown.length+(shown.length<matched.length?' of '+matched.length:'')+' / '+papers.length;
  if(!shown.length){list.innerHTML='<div class="empty">NOTHING MATCHES.</div>';return;}
  let html='',last='',n=0;
  for(const p of shown){
    const mk=p.b.label;
    if(mk!==last){html+=(last?'</ol>':'')+`<div class="month">${mk}</div><ol>`;last=mk;}
    n++;
    const links=[p.arxiv?`<a class="alpha" href="https://www.alphaxiv.org/abs/${p.arxiv}" target="_blank">alphaXiv</a>`:'',
                 p.arxiv?`<a href="https://arxiv.org/abs/${p.arxiv}" target="_blank">arXiv</a>`:'',
                 p.link?`<a href="${p.link}" target="_blank">S2</a>`:''].filter(Boolean).join(' ');
    html+=`<li class="entry"><div class="faces">${p.met.map(m=>avatar(m)).join('')}</div>
      <div><h2><a href="${p.link||'#'}" target="_blank">${p.title}</a></h2>
      <p class="byline">${markMet(p.authors,p.met)}</p>
      <div class="meta">${p.venue?`<span class="venue">${p.venue}</span>`:''}<span>${p.b.shown}</span>${links}</div></div></li>`;
  }
  list.innerHTML=html+'</ol>';
}
q.addEventListener('input',render);who.addEventListener('change',render);
rel.addEventListener('change',render);lim.addEventListener('change',render);
// Deep-link from the /people directory: ?p=Name focuses that one person.
const _pp=new URLSearchParams(location.search).get('p');
if(_pp&&people.includes(_pp)){who.value=_pp;rel.value='';}
render();

// ── private notes: right-click a face → passphrase → decrypt in-browser ──
const NC=document.getElementById('notecard');
let NOTES=null;  // {name:{aff,rel,met,why,research,log,notes}} once unlocked
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function decryptNotes(pass){
  const e=NOTES_ENC,enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function noteRows(c){
  const rows=[];
  if(c.aff) rows.push(['Affiliation',c.aff]);
  rows.push([c.rel==='met'?'Interacted':'Following',c.met||'—']);
  if(c.why) rows.push(['Why follow',c.why]);
  if(c.research) rows.push(['Research',c.research]);
  if(c.log) rows.push(['Log',c.log]);
  if(c.notes) rows.push(['Notes',c.notes]);
  return rows.map(([k,v])=>`<div class="nc-row"><span class="nc-k">${esc(k)}</span><span class="nc-v">${esc(v)}</span></div>`).join('');
}
function renderCard(name){
  const c=NOTES&&NOTES[name];
  NC.innerHTML=`<h3>${esc(name)}</h3>`+
    (c?`<div class="nc-sub">${c.rel==='met'?'interacted with':'following'}</div>${noteRows(c)}`
      :`<p class="nc-lock">No notes for this person yet.</p>`);
}
function place(x,y){
  const w=Math.min(340,innerWidth-24),m=12;
  NC.style.left=Math.max(m,Math.min(x,innerWidth-w-m))+'px';
  NC.style.top=(y+14)+'px';
  requestAnimationFrame(()=>{const r=NC.getBoundingClientRect();
    if(r.bottom>innerHeight-m)NC.style.top=Math.max(m,innerHeight-r.height-m)+'px';});
}
function showCard(name,x,y){
  NC.classList.add('show');place(x,y);
  if(!NOTES_ENC){NC.innerHTML=`<h3>${esc(name)}</h3><p class="nc-lock">No notes attached.</p>`;return;}
  if(NOTES){renderCard(name);return;}
  if(!(window.crypto&&crypto.subtle)){
    NC.innerHTML=`<h3>${esc(name)}</h3><div class="nc-lock">\u{1F512} Notes need a secure context to unlock — open this page over https (e.g. Tailscale Serve), not file://.</div>`;return;}
  NC.innerHTML=`<h3>${esc(name)}</h3><div class="nc-lock">\u{1F512} Private notes are locked.</div>`
    +`<input type="password" id="nc-pass" placeholder="passphrase" autocomplete="off">`
    +`<button class="nc-go" id="nc-go">Unlock</button><div class="nc-err" id="nc-err"></div>`
    +`<div class="nc-hint">Decrypts in your browser; kept for this tab only.</div>`;
  const inp=NC.querySelector('#nc-pass');inp.focus();
  const go=async()=>{
    const err=NC.querySelector('#nc-err');err.textContent='…';
    try{NOTES=await decryptNotes(inp.value);sessionStorage.setItem('pw_notes_pass',inp.value);renderCard(name);place(x,y);}
    catch(_){err.textContent='Wrong passphrase.';inp.select();}
  };
  NC.querySelector('#nc-go').onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter')go();};
}
function personAt(t){const el=t.closest('[data-n],.face,.mono');
  return el&&(el.dataset.n||el.getAttribute('title')||el.getAttribute('alt'));}
document.addEventListener('contextmenu',e=>{
  const name=personAt(e.target);if(!name)return;
  e.preventDefault();
  if(NOTES_ENC&&!NOTES&&window.crypto&&crypto.subtle){
    const s=sessionStorage.getItem('pw_notes_pass');
    if(s){decryptNotes(s).then(n=>{NOTES=n;showCard(name,e.clientX,e.clientY);})
      .catch(()=>showCard(name,e.clientX,e.clientY));return;}}
  showCard(name,e.clientX,e.clientY);
});
document.addEventListener('mousedown',e=>{if(NC.classList.contains('show')&&!NC.contains(e.target)&&e.button!==2)NC.classList.remove('show');},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')NC.classList.remove('show');});
</script></body></html>

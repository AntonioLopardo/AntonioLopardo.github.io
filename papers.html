        font-size: 11px;

        font-style: italic;
        color: var(--faint);

      }
      hr.a {
        border: 0;

      }

        align-items: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
        margin-bottom: 26px;
      }

        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--rule);

      .count {

        flex-wrap: wrap;

        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 16px 0 8px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--rule);
        padding: 4px 9px 4px 4px;
        cursor: pointer;
        background: none;
        font: inherit;
        font-size: 13px;
        color: var(--ink);
      }
      .chip:hover,
      .chip.on {
        border-color: var(--accent);
        background: var(--hl);
      }
      .chip.following {
        border-style: dashed;
      }
      .tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 1px solid var(--rule);
        padding: 1px 5px;
        color: var(--faint);
        margin-left: 0.5em;
        vertical-align: 0.12em;
      }
      .tag.met {
        color: var(--accent);
        border-color: var(--accent);
      }
      .month {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--faint);
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 40px 0 6px;
      }
      .month::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--rule);
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .entry {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 16px;
        padding: 16px 4px;
        border-bottom: 1px solid var(--rule);
      }
      .face,
      .mono {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
      }
      .mono {
        display: grid;
        place-items: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.02em;
        color: var(--paper);
      }
      .faces {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
      }
      h2 {
        font-family: "Fraunces", serif;
        font-weight: 640;
        font-size: 20px;
        line-height: 1.25;
        margin: 0 0 5px;
      }
      h2 a {
        color: inherit;
        text-decoration: none;
      }
      h2 a:hover {
        color: var(--accent);
      }
      .byline {
        font-size: 15px;
        color: var(--faint);
        margin: 0 0 6px;
      }
      .byline .met {
        color: var(--ink);
        background: var(--hl);
        padding: 0 0.25em;
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .byline .via {
        font-style: italic;
      }
      .meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11.5px;
        color: var(--faint);
        display: flex;
        gap: 1.3em;
        flex-wrap: wrap;
      }
      .meta .venue {
        text-transform: uppercase;
        letter-spacing: 0.13em;
      }
      .meta a {
        color: var(--accent-2);
        text-decoration: none;
      }
      .meta a.alpha {
        color: var(--accent);
        font-weight: 500;
      }
      .meta a:hover {
        text-decoration: underline;
      }
      .empty {
        font-family: "IBM Plex Mono", monospace;
        color: var(--faint);
        padding: 50px 0;
        text-align: center;
      }

        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);

        .entry {
          grid-template-columns: 1fr;
        }
        .faces {
          flex-direction: row;
          justify-content: flex-start;
          margin-bottom: 8px;
        }
      }

      const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const q = document.getElementById("q"),
        who = document.getElementById("who"),
        count = document.getElementById("count"),
        list = document.getElementById("list"),
        roster = document.getElementById("roster");
      // Three date precisions: exact month, year-only, unknown. Never invent a month.
      function bucket(p) {
        if (p.date) {
          const d = new Date(p.date);
          return { key: p.date, label: MONTHS[d.getMonth()] + " " + d.getFullYear(), shown: p.date };
        }
        if (p.year) return { key: p.year + "-00", label: p.year + " · month unknown", shown: String(p.year) };
        return { key: "", label: "Date unknown", shown: "" };
      }
      const papers = DATA.papers.map((p) => ({ ...p, b: bucket(p) })).sort((a, b) => b.b.key.localeCompare(a.b.key));
      const photos = DATA.photos || {};
      const people = [...new Set(papers.flatMap((p) => p.met))].sort();
      function hue(s) {
        let h = 0;
        for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360;
        return h;
      }
      function avatar(name, cls) {
        const src = photos[name];
        if (src) return `<img class="face ${cls || ""}" src="${src}" alt="${name}" title="${name}" loading="lazy">`;
        const init = name
          .split(/\s+/)
          .map((w) => w[0])
          .slice(0, 2)
          .join("")
          .toUpperCase();
        return `<span class="mono ${cls || ""}" style="background:hsl(${hue(name)} 42% 42%)" title="${name}">${init}</span>`;
      }
      const rels = DATA.rels || {};
      people.forEach((n) => who.append(new Option(n, n)));
      const chip = (n) => `<button class="chip ${rels[n]}" data-n="${n}">${avatar(n)}${n}</button>`;
      const group = (label, list) =>
        list.length
          ? `<div class="rosterhead">${label} · ${list.length}</div>
  <div class="roster">${list.map(chip).join("")}</div>`
          : "";
      roster.outerHTML =
        group(
          "Met in person",
          people.filter((n) => rels[n] === "met")
        ) +
        group(
          "Following",
          people.filter((n) => rels[n] !== "met")
        );
      document.addEventListener("click", (e) => {
        const b = e.target.closest(".chip");
        if (!b) return;
        who.value = who.value === b.dataset.n ? "" : b.dataset.n;
        render();
      });
      function markMet(authors, met) {
        let out = authors || "";
        const missing = [];
        met.forEach((name) => {
          const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const sur = name.trim().split(/\s+/).pop();
          let re = new RegExp(esc(name), "i");
          if (!re.test(out)) re = new RegExp("[\\w.'-]+\\s+" + esc(sur), "i");
          if (re.test(out)) out = out.replace(re, (m) => `<span class="met">${m}</span>`);
          else missing.push(name);
        });
        if (missing.length)
          out += (out ? " " : "") + `<span class="via">— via ${missing.map((n) => `<span class="met">${n}</span>`).join(", ")}</span>`;
        met.forEach((n) => {
          if (rels[n] !== "met") return;
        });
        return out;
      }
      function render() {
        const t = q.value.toLowerCase(),
          person = who.value;
        document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.dataset.n === person));
        const shown = papers.filter((p) => (!person || p.met.includes(person)) && (!t || (p.title + " " + p.authors).toLowerCase().includes(t)));
        count.textContent = shown.length + " / " + papers.length;
        if (!shown.length) {
          list.innerHTML = '<div class="empty">NOTHING MATCHES.</div>';
          return;
        }
        let html = "",
          last = "",
          n = 0;
        for (const p of shown) {
          const mk = p.b.label;
          if (mk !== last) {
            html += (last ? "</ol>" : "") + `<div class="month">${mk}</div><ol>`;
            last = mk;
          }
          n++;
          const links = [
            p.arxiv ? `<a class="alpha" href="https://www.alphaxiv.org/abs/${p.arxiv}" target="_blank">alphaXiv</a>` : "",
            p.arxiv ? `<a href="https://arxiv.org/abs/${p.arxiv}" target="_blank">arXiv</a>` : "",
            p.link ? `<a href="${p.link}" target="_blank">S2</a>` : "",
          ]
            .filter(Boolean)
            .join(" ");
          html += `<li class="entry"><div class="faces">${p.met.map((m) => avatar(m)).join("")}</div>
      <div><h2><a href="${p.link || "#"}" target="_blank">${p.title}</a></h2>
      <p class="byline">${markMet(p.authors, p.met)}</p>
      <div class="meta">${p.venue ? `<span class="venue">${p.venue}</span>` : ""}<span>${p.b.shown}</span>${links}</div></div></li>`;
        }
        list.innerHTML = html + "</ol>";
      }
      q.addEventListener("input", render);
      who.addEventListener("change", render);
      render();
